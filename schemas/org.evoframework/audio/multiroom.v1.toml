# Schema for the `audio.multiroom` shelf at shape version 1.
#
# The audio.multiroom shelf hosts the multi-room audio fan-out
# plugin: source-role admissions capture audio from a local
# PCM (typically a snd-aloop capture half fed by the
# playback chain's audio_output to the matching playback
# half) and fan frames out to receiver-role admissions on
# other devices in the same group over the framework's
# audio plane. Receiver-role admissions render incoming
# frames through their configured ALSA PCM.
#
# Reference plugin: `org.evoframework.multiroom.evo-native`
# in evo-device-audio (the framework's reference
# implementation; vendor distributions may admit alternative
# multi-room plugins targeting the same shelf, e.g. plugins
# bridging external multi-room ecosystems via the
# universal-translator pattern).

schema_version = 1
rack = "audio"
shelf = "multiroom"
shape = 1

description = """
Multi-room audio fan-out shelf. Source-role admissions
capture audio from a local PCM and fan frames out to
receiver-role admissions in the same group via the
framework's audio plane (TCP control + frame channel).
Receiver-role admissions render incoming frames through
their configured ALSA PCM. Single source-role admission
per group; multiple receiver-role admissions composable
under one source.
"""

# Requests this shelf supports. The reference plugin's
# operator surface is exposed through framework-level
# multi-room verbs (`admin group create / add-member /
# source-host show / network connections / dispatch`) plus
# the audible-time-trace read-side wire-op declared below.
[[requests]]
request_type = "audio.multiroom.frame_trace.snapshot"
description = "Returns the most recent rolling-window snapshot of the per-frame audible-time trace for the named group. Source-host-side aggregator publishes the `audio.multiroom.frame_trace` subject (declared below); this verb returns the subject's current value without subscribing. Read-side; capability-gated by `plugins_admin`. The wire-op is the canonical surface for generating multi-room verification evidence (audit traces, per-stage budget tables); operators in CLI-only / headless environments use it directly rather than subscribing to the subject."
payload_in = "tbd-review"
payload_out = "tbd-review"

# Published subjects — read-able surface for UI, operator
# wire-op consumers, and CI assertions.
#
# `audio.multiroom.frame_trace` is published by the
# source-host's multi-room admission, one per group whose
# source-host role is admitted on the local node. The
# subject carries a rolling window of recent per-frame
# audible-time trace records bracketing the six in-code
# stages of the framework's audio path between the source's
# frame capture and the receiver's `writei` return.
# Receiver-role admissions do NOT publish this subject;
# they back-report their per-frame timestamps to the
# source-host over the audio-plane's existing control
# channel via a `FrameTraceReport` message, and the
# source-host aggregates the source-side timestamps with
# each receiver's back-report into one combined record per
# `(sequence, receiver_device_id)` pair before publishing.
#
# Clock reconciliation rides the existing audio-plane
# NTP-lite probe; each record carries the per-peer clock
# offset at the time it was emitted so consumers can
# reconstruct wall-clock-aligned timestamps when comparing
# source-monotonic and receiver-monotonic fields.
#
# Stages 1 (MPD-internal), 2 (kernel snd-aloop loopback),
# and 8 (analog DAC) of `MULTIROOM-DESIGN.md` §6.1 are
# unmeasurable from inside the framework; the six in-code
# stages bracket them. The unmeasured stages surface as
# differences between bracket fields, not as direct
# observations.

[[subjects]]
name = "audio.multiroom.frame_trace"
description = "Rolling-window per-frame audible-time trace for one multi-room group whose source-host role is admitted on the local node. Source-host-aggregated from per-receiver back-reports over the audio-plane control channel. Updated on every observed frame; window size is operator-configurable (default 100 frames). Generated by the canonical wire-op `audio.multiroom.frame_trace.snapshot` for multi-room verification evidence."

[[subjects.fields]]
name = "group_id"
type = "string"
description = "Canonical id of the multi-room group this trace belongs to. Matches the group entity in the source-host's `group_store`."

[[subjects.fields]]
name = "window_size"
type = "u32"
description = "Configured rolling-window size (number of most-recent records retained). Operator-configurable; default 100."

[[subjects.fields]]
name = "records"
type = "array<frame_trace_record>"
description = "Rolling window of per-frame trace records, ordered oldest-first. Each record represents one (sequence, receiver_device_id) tuple; a single frame fanned out to N receivers yields N records (one per receiver)."

[[subjects.fields]]
name = "last_update_at"
type = "system_time"
description = "Timestamp of the most recent record append."

# Per-record fields. Each record bracket six in-code stages
# of the audible-time path.
[[subjects.record_types.frame_trace_record]]
name = "sequence"
type = "u64"
description = "Source-host's per-emit-frame sequence counter at capture-emit time. Unique within the (group, source-host-load-lifetime) tuple."

[[subjects.record_types.frame_trace_record]]
name = "receiver_device_id"
type = "string"
description = "Canonical id of the receiver this record's timestamps were back-reported from. The source-host aggregator keys records by `(sequence, receiver_device_id)`; a single frame fanned to N receivers produces N records."

[[subjects.record_types.frame_trace_record]]
name = "presentation_time_ms"
type = "u64"
description = "Source-host's monotonic presentation-time-ms recorded on the frame at capture-emit time (the value carried in the AudioFrame envelope to receivers)."

[[subjects.record_types.frame_trace_record]]
name = "source_capture_readi_return_ns"
type = "u64"
description = "Source-host monotonic ns at which the capture-thread's `io.readi(&buf)` returned for this frame's chunk. §6.1 stage 3a."

[[subjects.record_types.frame_trace_record]]
name = "source_mpsc_send_ns"
type = "u64"
description = "Source-host monotonic ns at which the capture-thread sent the chunk into the source-task channel. §6.1 stage 3b."

[[subjects.record_types.frame_trace_record]]
name = "source_mpsc_recv_ns"
type = "u64"
description = "Source-host monotonic ns at which the source async task received the chunk from the capture-thread channel. §6.1 stage 4a."

[[subjects.record_types.frame_trace_record]]
name = "source_fanout_enter_ns"
type = "u64"
description = "Source-host monotonic ns at which the source async task invoked `fan_out_audio_frame` for this frame. §6.1 stage 4b."

[[subjects.record_types.frame_trace_record]]
name = "source_wire_send_ns"
type = "u64"
description = "Source-host monotonic ns at which the audio-plane queued the frame onto the per-peer write channel (immediately before TCP serialisation). §6.1 stage 5a."

[[subjects.record_types.frame_trace_record]]
name = "receiver_wire_recv_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's audio-plane decoded the AudioFrame envelope and queued it onto the per-subscriber broadcast channel. §6.1 stage 5b. Receiver-back-reported."

[[subjects.record_types.frame_trace_record]]
name = "receiver_scheduler_dequeue_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's render scheduler dequeued this frame for `writei`. §6.1 stage 6. Receiver-back-reported."

[[subjects.record_types.frame_trace_record]]
name = "receiver_writei_return_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's `io.writei(&samples)` returned for this frame. §6.1 stage 7. Receiver-back-reported. Note that `writei` return is NOT analog audible-time; stage 8 (ALSA → DAC analog) is unmeasurable in software."

[[subjects.record_types.frame_trace_record]]
name = "clock_offset_ns"
type = "i64"
description = "Per-peer clock offset at the time this record was emitted, sourced from the audio-plane NTP-lite probe. `source_monotonic - receiver_monotonic`. Consumers reconstructing wall-clock-aligned timestamps subtract this value from receiver-monotonic fields. Captured at record-emit time so retrospective analyses can correct for the offset observed at that frame's transit, not the current one."

[[acceptance]]
name = "multiroom-single-source-per-group"
detail = "Cardinality refused at admission if a second source-role multi-room plugin attempts admission for the same group."

[[acceptance]]
name = "multiroom-non-panic-on-pcm-loss"
detail = "Source-role plugin survives capture PCM loss (snd-aloop unloaded, audio backend stopped) without panic. Returns structured error + degrades cleanly. Receiver-role plugin survives playback PCM loss with the same posture."

[[acceptance]]
name = "multiroom-frame-trace-source-only"
detail = "The `audio.multiroom.frame_trace` subject MUST be published only by the source-host of each group. Receivers MUST NOT publish a parallel per-node trace subject; the source-host aggregator is the single point of truth for cross-node alignment."

[[acceptance]]
name = "multiroom-frame-trace-rolling-bound"
detail = "The rolling window MUST be bounded. The subject's serialised footprint stays within the framework's subject-substrate size budget regardless of how long the source-host has been running."

[[acceptance]]
name = "multiroom-frame-trace-clock-offset-from-audio-plane"
detail = "The `clock_offset_ns` field MUST be sourced from the audio-plane's existing NTP-lite clock-sync probe. A multi-room plugin MUST NOT introduce a parallel clock-sync mechanism for trace purposes; the audio-plane sync probe is the single source of truth for cross-node clock alignment."

# NOTE: per-verb payload contracts pending plugin-author
# review. The reference plugin's manifest declares the
# request_types it supports; payload contracts are reviewed
# alongside the reference plugin's wire-surface
# stabilisation in a future schemas-repo release.
