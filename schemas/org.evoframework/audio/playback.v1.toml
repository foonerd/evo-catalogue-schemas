# Schema for the `audio.playback` shelf at shape version 1.
#
# Playback shelves host warden-shape plugins. A warden owns
# a resource (the local audio playback device) and exposes
# `course_correct` verbs for state-transition operations
# (play / pause / stop / next / previous / seek /
# set_volume). Reference plugin:
# `org.evoframework.playback.mpd` in evo-device-audio.
#
# WARDEN SHAPE — note this schema differs from respondent
# shelves. Wardens do not declare `request_types`; they
# declare `course_correct_verbs`. The framework gates
# dispatch at the router against this declared verb set.

schema_version = 1
rack = "audio"
shelf = "playback"
shape = 1
shape_kind = "warden"

description = """
Playback warden — owns the local audio playback device and
exposes course_correct verbs for play / pause / stop /
next / previous / seek / set_volume state transitions.
Wardens are single-claimant per shelf; consumers route
playback intent through the framework's admission boundary,
never directly to the warden.
"""

# course_correct verbs this shelf accepts. The warden's
# manifest declares
# `capabilities.warden.course_correct_verbs`; the framework
# refuses any verb not in the declared set at the router
# boundary before the warden's `course_correct` body is
# invoked.
course_correct_verbs = [
    "play",
    "pause",
    "stop",
    "next",
    "previous",
    "seek",
    "set_volume",
]

# Per-verb payload contracts. Payloads travel as opaque
# bytes; the warden parses them in its `course_correct`
# body. The shapes below describe the encoding the
# reference plugin honours and the contract every
# warden on this shelf is expected to match.
[[verbs]]
name = "play"
payload_in = """
Empty payload starts playback at the current queue position
(resumes from pause if applicable, plays from position 0 if
the queue is fresh). Optional non-empty payload is a
zero-based queue position rendered as an unsigned decimal
integer (UTF-8 ASCII), e.g. `"3"` plays the 4th queued
item.
"""
payload_out = "empty"

[[verbs]]
name = "pause"
payload_in = """
UTF-8 ASCII boolean flag selecting pause vs unpause:
`"1"` / `"true"` pauses playback; `"0"` / `"false"`
unpauses. Empty payload is rejected with a structured
contract refusal.
"""
payload_out = "empty"

[[verbs]]
name = "stop"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "next"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "previous"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "seek"
payload_in = """
Absolute position from the current track's start, expressed
in milliseconds as an unsigned decimal integer (UTF-8
ASCII), e.g. `"1250"` seeks to 1.25 seconds. The warden
clamps the value to the track's duration.
"""
payload_out = "empty"

[[verbs]]
name = "set_volume"
payload_in = """
Linear volume percentage in 0..=100, expressed as an
unsigned decimal integer (UTF-8 ASCII), e.g. `"50"`. Values
outside the range are clamped by the warden.
"""
payload_out = "empty"

# Acceptance criteria a plugin claiming to satisfy this
# shape MUST meet. The framework does not enforce these at
# admission (no runtime assertion harness yet); they
# document what a future shape-conformance test would
# check.
[[acceptance]]
name = "warden-single-claimant"
detail = "Only one playback warden may be admitted to this shelf at a time. Cardinality refused at admission."

[[acceptance]]
name = "warden-non-panic-on-dependency-loss"
detail = "Warden survives dependency loss (audio device unavailable, ALSA driver crash, MPD daemon exit) without panicking. Returns structured error to in-flight ops; the steward sees a typed warden refusal rather than a process abort."

[[acceptance]]
name = "warden-course-correct-gated"
detail = "Framework refuses any course_correct verb not in the manifest's declared `capabilities.warden.course_correct_verbs` list. Tested at admission via manifest-drift checks."

[[acceptance]]
name = "warden-payload-versioning-by-encoding"
detail = "Payloads are versioned by their encoding contract per verb (above). A breaking encoding change is a shape bump; additive payload extensions (new optional fields, additional acceptable forms) ride at the same shape."

[[acceptance]]
name = "warden-volume-clamping"
detail = "set_volume payloads outside the 0..=100 range are clamped, not rejected. Matches the operator-experience principle that a slider value at the extreme end behaves as the extreme rather than failing the dispatch."

[[acceptance]]
name = "stream-format-published-on-load-and-every-format-change"
detail = "The warden announces the `stream_format` subject (addressing `{ scheme = 'evo.audio.playback', value = 'stream_format' }`, subject_type `audio_playback_stream_format`) on load and updates it on every audio-format change (track transition with different rate, gapless transition into a different-rate track, MPD reopen at a different format, source-pcm vs source-dsd switch). The state payload carries `{ v, effective, source }` where `effective` is the AudioFormat reaching the DAC after resampling + DoP wrapping and `source` is the AudioFormat MPD decoded from the file (null when source isn't separately knowable; subscribers treat null as 'source = effective'). AudioFormat round-trips the evo-plugin-sdk `AudioFormat` serde representation — PCM `{ kind, codec, rate_hz, channels }`, DSD `{ kind, rate, transport, channels }`, EncodedPassthrough `{ kind, codec, rate_hz, channels }`. The subject is the single source of truth for the live stream format; out-of-band format channels (parallel wire ops, sidecar events, format fields crammed into `track`) are forbidden."

# Subjects the warden announces. Consumers (operator UI's
# format display, future loggers / auditors) resolve the
# addressing below against the framework's subject querier
# and subscribe via SubjectStateSubscriber.

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "stream_format" }
subject_type = "audio_playback_stream_format"
description = """
Live audio-stream format the warden is feeding into the
write endpoint. Updates whenever the audio format reaching
the DAC changes (track transition with different rate,
gapless transition into a different-rate track, MPD reopen
at a different format, source-pcm vs source-dsd switch).
Carries both the effective format (post-resampling, post-
DoP-wrapping; what reaches the DAC) and the source format
(what MPD decoded from the file; null when the source isn't
separately knowable). DSD streams carry the transport
discriminant (DoP vs NativeUsb) so the operator UI can show
whether DoP wrapping is active.

Payload shape: `{ v: 1, effective: AudioFormat, source:
AudioFormat | null }` where AudioFormat round-trips the
evo-plugin-sdk `AudioFormat` serde representation.

The subject is the only sanctioned surface for live stream
format; consumers MUST subscribe rather than polling a verb
or recovering from happenings.
"""
