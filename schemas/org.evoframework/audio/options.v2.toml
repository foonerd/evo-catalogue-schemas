# Schema for the `audio.options` shelf at shape version 2.
#
# Shape 2 extends shape 1 with three operator-facing volume-
# safety + perception controls:
#
# * `options.set_startup_volume` — initial volume the playback
#   warden restores on plugin load / steward restart, protecting
#   ears + speakers from loud-on-boot incidents.
# * `options.set_max_volume` — operator-imposed ceiling above
#   which the playback warden refuses to go. Sensible default
#   for the audiophile-grade reference (100; no cap), but
#   operators with sensitive speakers or shared living
#   arrangements set a lower number.
# * `options.set_volume_curve` — perceived-loudness mapping
#   (`linear` / `log` / `natural`) the playback warden applies
#   between the operator's slider and the actual gain.
#
# All shape-1 verbs remain present; consumers querying for
# shape >= 1 keep working. The persisted state file gains three
# new fields with safe defaults; absence of the fields in an
# existing state file is treated as the default values
# (no migration step required).
#
# Options plugins host operator-facing audiophile-grade
# settings for the reference audio chain: resampling
# preference, mixer type, DSD-over-PCM enablement, output
# device selection, volume normalisation. The plugin
# publishes the `audio.options.settings` subject as the
# operational source of truth; subscribed plugins
# (`audio.delivery` plugins, `audio.playback` wardens)
# observe the subject and reconfigure in place on operator
# gestures, avoiding admission churn.
#
# Plugins on this shelf are reactive respondents: they own
# no audio data plane, they own the settings projection.
# Settings persist under the plugin's state directory
# (`/var/lib/evo/<plugin-name>/state.toml`); the framework
# guarantees per-plugin filesystem isolation. On restart the
# plugin rehydrates from this file; absence is treated as
# the documented defaults.
#
# Reference plugin: `org.evoframework.playback.options` in
# evo-device-audio.

schema_version = 1
rack = "audio"
shelf = "options"
shape = 2

description = """
Operator-facing audiophile settings projection for the
reference audio chain. Publishes the audio.options.settings
subject; subscribed plugins (delivery, playback warden)
react in place on operator gestures. Reactive-only shape;
no audio data plane.
"""

# Request types the framework dispatches against this
# shelf. The read verb returns the current settings; each
# write verb validates + persists + updates the subject;
# the framework's subject substrate fans the change out to
# every subscriber.
[[requests]]
request_type = "options.get_settings"
description = """
Return the current settings projection: resampling /
mixer_type / dop / output_device / volume_normalization.
Operator-facing read verb; idempotent.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_resampling"
description = """
Set the resampling preference (target sample rate, enable
flag). Validates the requested rate against the host's
hardware-supported set (sourced from audio.delivery's
probe_hardware response); persists; updates the subject.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_mixer_type"
description = """
Set the mixer type (`hardware` / `software` / `none`).
Affects the delivery plugin's pcm chain reconstruction:
hardware binds the active card's mixer; software inserts
the platform's software-volume node; none refuses volume
control.

Mixer-type writes drive an ORCHESTRATED transition (state
machine + lock; the plugin owns transition ordering across
delivery + playback subordinates). The mixer-transition
invariants contract pins the protocol: see acceptance
criteria `mixer-transition-loudness-continuity`,
`mixer-transition-no-blast-risk`,
`mixer-transition-single-authority`,
`mixer-transition-deterministic-carry-over`,
`mixer-transition-rollback-safe`, and
`mixer-transition-operator-truth`. The verb returns success
only after the full state machine lands or rolls back to the
prior valid state; concurrent mixer / route / device-bind
gestures are serialised via a per-plugin transition lock.
The four lifecycle happenings
`audio.mixer_transition.{started,applied,rolled_back,failed}`
make the protocol observable; downstream consumers (UI
affordances, audit tooling) bind against them.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_mixer_device"
description = """
Set the ALSA mixer-device coordinate for hardware-mixer mode
(typical shape: `hw:<card>` matching the card name in
`/etc/asound.conf`). Required-when-`mixer_type = hardware`;
optional otherwise. The setter validates the device exists
on the host (sourced from `audio.delivery.list_cards`)
before persisting. Without this coordinate populated,
hardware-mixer mode cannot resolve a target and the playback
warden must refuse or degrade.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_mixer_control"
description = """
Set the ALSA mixer-control name (e.g. `Master`, `PCM`,
DAC-specific control names visible via `amixer scontrols`).
Required-when-`mixer_type = hardware`; optional otherwise.
Paired with `mixer_device`: together they form the
coordinate the playback warden uses to bind hardware volume
control. The setter validates the control exists on the
named device via `amixer -c <device> scontrols` before
persisting.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_dop"
description = """
Enable / disable DoP (DSD over PCM) packing for
DSD-capable DACs. Validates the host's DAC declares
`dsd_capable = true` (sourced from audio.delivery's
probe_hardware response); persists; updates the subject.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_output_device"
description = """
Set the bound output device (ALSA card / hw: descriptor,
platform equivalent). Validates the device exists on the
host (sourced from audio.delivery's list_cards response);
persists; updates the subject. Subscribers react: the
delivery plugin rewires the modular pcm chain to point at
the new device.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_volume_normalization"
description = """
Set the volume normalisation policy (`disabled` /
`track` / `album` / `loudness_lufs`). Persists; updates
the subject. Playback wardens (e.g. playback.mpd)
re-evaluate per-track on the next play.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_startup_volume"
description = """
Set the operator-facing startup-volume floor (0..=100). The
playback warden restores this value on plugin load + steward
restart. The setter MUST refuse values above 100 and above
the current `max_volume_percent` ceiling (the relationship
`startup <= max` is an invariant; the operator raises max
first if they want a higher startup).
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_max_volume"
description = """
Set the operator-imposed maximum-volume ceiling (0..=100).
The playback warden refuses any volume gesture above this
value, surfacing a structured refusal to the operator.
When the new ceiling is below the current
`startup_volume_percent`, the plugin clamps startup to the
new ceiling so the `startup <= max` invariant is
maintained (the clamp emits a second
`audio.options.changed` happening so subject-stream
consumers see both fields' new values).
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.set_volume_curve"
description = """
Set the perceived-loudness mapping curve. Domain:
{`linear`, `log`, `natural`}. The playback warden applies
this mapping between the operator's volume slider position
and the actual gain (hardware mixer dB or software gain
factor, depending on `mixer_type`).
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.restore_last_known_good"
description = """
Restore the most-recently-known-working settings snapshot
(the framework's LKG mechanism for operator-recoverable
misconfiguration). Persists the LKG; updates the subject;
all subscribers reconfigure.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "options.reset_to_defaults"
description = """
Reset the settings to the documented defaults
(`resampling = off`, `mixer_type = software`,
`dop = false`, `output_device = first listed by
delivery`, `volume_normalization = disabled`,
`startup_volume_percent = 30`,
`max_volume_percent = 100`,
`volume_curve = linear`). Persists; updates the subject;
subscribers reconfigure.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

# Acceptance criteria a plugin claiming to satisfy this
# shape MUST meet.
[[acceptance]]
name = "options-publishes-settings-subject"
detail = "Plugin publishes the `audio.options.settings` subject at load time, populated with the rehydrated state (or defaults if no persisted state exists). The subject's schema declares the typed field set listed above; subscribers consume via `subscribe_subjects = true`."

[[acceptance]]
name = "options-persists-on-write"
detail = "Each `set_*` verb persists the updated state to the plugin's state directory before returning success. A plugin crash between persist and subject update is acceptable; a plugin returning success without persisting is a contract violation."

[[acceptance]]
name = "options-rehydrates-on-restart"
detail = "On load, the plugin reads its persisted state and republishes the subject with the loaded values. Absence of persisted state is treated as defaults; partial / corrupt files trigger the LKG fallback if available, defaults otherwise. The plugin MUST NOT panic on file-system errors."

[[acceptance]]
name = "options-validates-against-hardware"
detail = "Write verbs that touch hardware-bound state (set_resampling, set_output_device, set_dop) MUST validate the requested value against the audio.delivery shelf's probe responses before accepting. Refusal carries a structured contract error naming the offending field and the validated alternatives."

[[acceptance]]
name = "options-reactive-only-lifecycle"
detail = "Plugin's manifest declares `lifecycle.mode = \"reactive-only\"`. Operator TOML edits do NOT trigger admission churn; the actuation path is the subject substrate. The plugin MUST NOT require a teardown + re-admit cycle to apply settings changes."

[[acceptance]]
name = "volume-safety-invariant-startup-le-max"
detail = "set_startup_volume MUST refuse a value above max_volume_percent. set_max_volume MUST clamp startup_volume_percent down to the new ceiling when the ceiling is lowered below the current startup. The relationship `startup_volume_percent <= max_volume_percent` is invariant across all setter invocations."

[[acceptance]]
name = "volume-percent-domain-zero-to-hundred"
detail = "set_startup_volume + set_max_volume MUST refuse values outside 0..=100 with a structured Permanent error. set_volume_curve MUST refuse values outside {linear, log, natural} with a structured Permanent error."

[[acceptance]]
name = "mixer-transition-loudness-continuity"
detail = "Switching mixer mode at a constant operator-volume position MUST NOT cause an abrupt jump or drop at the effective output. The orchestrator carries the prior authority's level forward to the new authority via an explicit, reproducible mapping; the new authority is set BEFORE the unmute step. Tolerance values are per-device-profile and hardware-calibrated."

[[acceptance]]
name = "mixer-transition-no-blast-risk"
detail = "No transition step may momentarily unmute or open the chain at full scale unintentionally. The orchestrator's command sequence is: pre-mute -> read carried level -> set new authority to carried level -> switch fragment -> restart playback chain -> verify effective level -> unmute. The unmute step is reachable ONLY after a successful set-and-verify; on any earlier failure, the chain remains muted and the rollback path runs."

[[acceptance]]
name = "mixer-transition-single-authority"
detail = "At every point in time EXACTLY ONE volume authority is effective: MPD software, ALSA hardware, or none. The orchestrator's state machine enforces no overlap window between authorities — the new authority is established only after the prior is normalised to unity / pass-through (S/W -> H/W) or after the prior is read out and reduced (H/W -> S/W). Concurrent mixer / route / device-bind gestures are serialised via the per-plugin transition lock; the second gesture waits for the first to complete or rollback."

[[acceptance]]
name = "mixer-transition-deterministic-carry-over"
detail = "The carried volume value used to seed the new authority MUST be explicit and reproducible. The orchestrator reads the prior authority's effective level via a deterministic source (hardware: amixer cget against the configured device + control; software: MPD's mixer state), applies the operator's volume curve, and writes the resulting value verbatim to the new authority. The carry-over path is captured in the audit log; re-running the same transition with the same inputs produces the same output level."

[[acceptance]]
name = "mixer-transition-rollback-safe"
detail = "If any step fails (carried-level read, pre-mute, set new authority, fragment switch, restart, verify, unmute), the orchestrator MUST revert the chain to the prior valid state: prior fragment restored, prior authority's level restored, mute released. The rollback is observable via the `audio.mixer_transition.rolled_back` happening with the operator-readable reason + the phase the failure occurred at. A rollback that itself fails escalates to `audio.mixer_transition.failed` with the chain left in mute as the safe terminal state."

[[acceptance]]
name = "mixer-transition-operator-truth"
detail = "After the transition lands, the UI's volume reflects the EFFECTIVE output path (the new authority's value), not the operator's pre-transition slider position. The orchestrator's `audio.mixer_transition.applied` happening's payload includes the post-transition effective level so subscribers can update their cached display without re-querying."

[[acceptance]]
name = "mixer-transition-lifecycle-happenings"
detail = "Every transition fires the lifecycle happenings in the operator-observable order: `audio.mixer_transition.started` on lock acquisition + state-machine entry; `audio.mixer_transition.applied` on successful completion of all eight steps; `audio.mixer_transition.rolled_back` on failure of any step that successfully reverts to the prior valid state; `audio.mixer_transition.failed` on failure that cannot be reverted (terminal state, chain left muted). The four happenings are MUTUALLY EXCLUSIVE per transition: `applied` xor `rolled_back` xor `failed` — never two of them for the same `started` happening."

[[acceptance]]
name = "mixer-transition-hardware-mode-requires-device-and-control"
detail = "Setting `mixer_type = hardware` without populating `mixer_device` + `mixer_control` MUST refuse with a structured Permanent error naming both required fields. Degrade-to-software fallback IS permitted only when the operator explicitly requested it via a separate gesture; silent automatic degrade on a missing coordinate is a contract violation (operator picked hardware for a reason; the safe response is to surface the gap, not paper over it)."

[[acceptance]]
name = "mixer-transition-envelope-coordination"
detail = "The orchestrator coordinates the safety envelope's mute / unmute steps with the playback warden via two paired subjects. (1) `evo.audio.mixer_transition:envelope_requested` — orchestrator-published. State: `{ generation: u64, requested_state: \"muted\" | \"unmuted\", requested_at_ms: u64 }`. Each transition's pre-mute step bumps the generation and publishes `requested_state = muted`; the unmute step bumps again and publishes `requested_state = unmuted`. (2) `evo.audio.mixer_transition:envelope_observed` — playback-warden-published acknowledgement. State: `{ generation: u64, observed_state: \"muted\" | \"unmuted\", observed_at_ms: u64 }`. The warden subscribes to envelope_requested, mutes / unmutes its playback chain in response (e.g. MPD pause / resume), and publishes envelope_observed with the matching generation when the chain has actually transitioned. The orchestrator subscribes to envelope_observed and advances to the next state-machine step ONLY when it observes a matching `(generation, requested_state)` pair within a bounded timeout. Timeout → rollback chain. The generation field disambiguates concurrent transitions (which the per-plugin transition lock already prevents but the protocol carries belt-and-suspenders defence)."

[[acceptance]]
name = "mixer-transition-lifecycle-emitter-is-orchestrator"
detail = "The four `audio.mixer_transition.*` lifecycle happenings (started / applied / rolled_back / failed) are emitted by the orchestrator (the playback.options-shape plugin) ONLY. Subordinate plugins (audio.delivery, audio.playback) MUST NOT emit these happenings themselves; downstream observers (UI affordances, audit tooling) subscribe to the orchestrator-emitted stream as the single canonical source of mixer-transition lifecycle state. Subordinates communicate their step-completion via the envelope_observed subject (above), not via lifecycle happenings."

# NOTE: payload_in / payload_out for the eight request
# types are marked `tbd-review` pending plugin-author
# review of the reference `org.evoframework.playback.options`'s
# wire contract. The schema's request_type list,
# subscriber surface, and acceptance criteria are stable;
# the wire payload shapes land in a follow-up authoring
# step. See evo-catalogue-schemas CHANGELOG.
