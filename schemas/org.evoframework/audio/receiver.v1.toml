# Schema for the `audio.receiver` shelf at shape version 1.
#
# Receivers are the device as a network target: another player or phone
# finds the device and sends audio to it. One plugin per protocol stocks
# the shelf, each with its own disjoint verb set, under the multi-occupant
# admission gate (the same arrangement as `networking.shares`). This shape
# carries the DLNA renderer's verbs and the AirPlay receiver's; the
# Bluetooth sink adds its own as a further occupant.
#
# Reference plugin: `org.evoframework.receiver.dlna` in evo-device-audio.
# It is the renderer: it advertises over SSDP, serves the device and
# service descriptions and owns the control and event endpoints. It is
# orthogonal to `audio.dlna`, the MediaServer client, and shares no state
# with it.
#
# Reference plugin for AirPlay: `org.evoframework.receiver.airplay` in
# evo-device-audio. It is an AirPlay 2 audio receiver (buffered audio
# only), advertises over mDNS, and plays what a sender streams to it
# through the local player. It is orthogonal to `receiver.dlna`.

schema_version = 1
rack = "audio"
shelf = "receiver"
shape = 1

description = """
Audio receiver surface. The DLNA occupant presents the device as a UPnP
MediaRenderer that controllers (phones, desktop "cast to device") send
tracks to; what arrives plays through the local player. The renderer is
disabled by default and holds no socket while disabled. Enabling and
disabling are operator gestures that gate at `write:network_admin`,
because an enabled renderer accepts control from any device on the local
network. The state is published on the `audio_receiver_dlna` subject.
The AirPlay occupant presents the device as an AirPlay 2 speaker that
Apple devices send audio to; the audio plays through the local player
as a queue item that the receiver adds and removes itself. Like the
DLNA renderer it is disabled by default, holds no socket and no mDNS
registration while disabled, and enabling or disabling it gates at
`write:network_admin`. Its state is published on the
`audio_receiver_airplay` subject.
"""

# ----- Request types -----

[[requests]]
request_type = "receiver.dlna.get_state"
description = """
Read the renderer's state. Payload is `{ v: 1 }` (an empty payload is
accepted). Returns `{ v: 1, state: { v: 1, state, reason?, enabled,
friendly_name, udn, port, last_update_at_ms } }` where `state` is one of
`disabled`, `starting`, `advertising`, `degraded`; `reason` is present
only when `degraded` and is a code such as `http_bind_failed` or
`ssdp_bind_failed`; `enabled` is the operator switch; `udn` is the device
UUID without its `uuid:` prefix; `port` is the TCP port the description is
served on, `0` until the first enable. The same envelope is the subject
payload. No scope required.
"""

[[requests]]
request_type = "receiver.dlna.enable"
description = """
Turn the renderer on and persist the switch. Payload is `{ v: 1 }`.
Binds the description server, then the SSDP responder, and announces the
device. Returns the same shape as `get_state`. A bind failure leaves the
renderer enabled and `degraded` with a reason code, so a restart retries;
it is not a verb error. Gates at `write:network_admin`.
"""

[[requests]]
request_type = "receiver.dlna.disable"
description = """
Turn the renderer off and persist the switch. Payload is `{ v: 1 }`.
Sends SSDP `byebye`, closes every socket and returns the `disabled`
state. Idempotent. Gates at `write:network_admin`.
"""

[[requests]]
request_type = "receiver.airplay.get_state"
description = """
Read the AirPlay receiver's state. Payload is `{ v: 1 }` (an empty
payload is accepted). Returns `{ v: 1, state: { v: 1, state, reason?,
enabled, friendly_name, port, open, session?, last_update_at_ms } }`
where `state` is one of `disabled`, `starting`, `advertising`,
`session`, `degraded`; `reason` is present only when `degraded` and is
a code such as `avahi_unavailable`, `loopback_unavailable`,
`port_bind_failed` or `playback_refused`; `enabled` is the operator
switch; `port` is the TCP control port, `0` until the first enable;
`open` is `true` when no password is set, so any device on the local
network may send audio; `session` is present only while `state` is
`session` and is `{ peer, since_ms }` with `peer` the sender's address.
The password is never part of this envelope or of the subject payload.
The same envelope is the subject payload. No scope required.
"""

[[requests]]
request_type = "receiver.airplay.enable"
description = """
Turn the AirPlay receiver on and persist the switch. Payload is
`{ v: 1, password?: string }`. When `password` is present it is 1 to 128
printable characters, is stored in the plugin's credential store and
becomes the pairing password; when absent, any previously stored
password is cleared and the receiver is open (`open: true`). A password
outside that rule is a Permanent refusal and changes nothing. The
payload is a secret and MUST NOT be logged or echoed. Registers the
device with the local mDNS daemon, opens the control listener and
returns the same shape as `get_state`. A bind or registration failure
leaves the receiver enabled and `degraded` with a reason code, so a
restart retries; it is not a verb error. Enabling an already-enabled
receiver with a different `password` replaces the password and ends any
active session. Gates at `write:network_admin`.
"""

[[requests]]
request_type = "receiver.airplay.disable"
description = """
Turn the AirPlay receiver off and persist the switch. Payload is
`{ v: 1 }`. Ends any active session (the player's capture item is
removed first), withdraws the mDNS registration, closes every socket
and returns the `disabled` state. Idempotent. Gates at
`write:network_admin`.
"""

# ----- Acceptance rows -----

[[acceptance]]
name = "receiver-default-disabled"
detail = "A device that has never been told otherwise MUST come up with the DLNA renderer disabled and no socket open. Enabling is an operator gesture."

[[acceptance]]
name = "receiver-gestures-gate-at-write-network-admin"
detail = "receiver.dlna.enable and receiver.dlna.disable declare `write:network_admin` in the plugin manifest. get_state needs no scope. The framework dispatcher is the authoritative gate; the plugin never re-checks the principal."

[[acceptance]]
name = "receiver-advertises-a-media-renderer"
detail = "While enabled, the device description is served over HTTP and declares deviceType `urn:schemas-upnp-org:device:MediaRenderer:1` with the AVTransport, RenderingControl and ConnectionManager services, and the device answers SSDP searches for them. It declares no ContentDirectory service."

[[acceptance]]
name = "receiver-holds-no-socket-while-disabled"
detail = "After disable, and before the first enable, the plugin holds no UDP or TCP listener."

[[acceptance]]
name = "receiver-answers-lan-peers-only"
detail = "The renderer accepts HTTP connections and answers SSDP datagrams only from local-network peers (RFC 1918, loopback, link-local, unique-local). Other peers are dropped without a reply."

[[acceptance]]
name = "receiver-leaves-the-dlna-client-unchanged"
detail = "Enabling the renderer MUST NOT change the `audio.dlna` client's discovered-server set and MUST NOT stop its passive SSDP listener from binding."

[[acceptance]]
name = "airplay-default-disabled"
detail = "A device that has never been told otherwise MUST come up with the AirPlay receiver disabled, with no socket open and no mDNS registration. Enabling is an operator gesture."

[[acceptance]]
name = "airplay-gestures-gate-at-write-network-admin"
detail = "receiver.airplay.enable and receiver.airplay.disable declare `write:network_admin` in the plugin manifest. get_state needs no scope. The framework dispatcher is the authoritative gate; the plugin never re-checks the principal."

[[acceptance]]
name = "airplay-advertises-both-service-types"
detail = "While enabled and not degraded, the device is registered as `_airplay._tcp` and `_raop._tcp` with the same instance name and control port, and the registration carries the password-required flag exactly when a password is set. After disable, and before the first enable, neither service is registered."

[[acceptance]]
name = "airplay-holds-no-socket-while-disabled"
detail = "After disable, and before the first enable, the plugin holds no TCP or UDP listener and no open playback substream."

[[acceptance]]
name = "airplay-answers-lan-peers-only"
detail = "The receiver accepts connections only from local-network peers (RFC 1918, loopback, link-local, unique-local). Other peers are dropped without a reply."

[[acceptance]]
name = "airplay-serves-one-session"
detail = "While a session is active a second sender is refused at SETUP and the active session is undisturbed. A session that cannot obtain the player is refused rather than accepted and silenced."

[[acceptance]]
name = "airplay-password-stays-in-the-credential-store"
detail = "The pairing password appears in no state envelope, subject payload, get_state reply, log line or error text. A sender presenting a wrong password is refused at pairing."

[[acceptance]]
name = "airplay-ends-its-player-item-with-the-session"
detail = "When a session ends for any reason (sender teardown, connection loss, disable, plugin stop) the plugin asks the player to end the capture before it reports the session over, so no capture item is left playing silence."

[[acceptance]]
name = "airplay-leaves-the-queue-as-found"
detail = "A session adds one item to the end of the queue and removes it at the end. The other queue items and their order are unchanged. The interrupted song is not resumed: after the session the player may be stopped. Authority 2026-11-27: 'current position unchanged' does not mean re-select or resume the prior song (MPD cannot re-select without playing)."

[[acceptance]]
name = "airplay-sender-volume-is-the-device-volume"
detail = "The sender's volume is mapped linearly onto the device's global volume through the player's set_volume and set_mute verbs (AirPlay 0 dB is full, about -30 dB is zero, -144 dB is mute). The plugin keeps no second volume."

[[acceptance]]
name = "airplay-leaves-the-dlna-renderer-unchanged"
detail = "Enabling or disabling the AirPlay receiver MUST NOT change the DLNA renderer's state or sockets, and the reverse."
