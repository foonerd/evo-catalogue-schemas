# Schema for the `audio.zones` shelf at shape version 1.
#
# A zone is a name over one or more logical outputs — the
# `logical:<n>` ids `delivery.list_logical_outputs` on the
# `audio.delivery` shelf returns. A zone is not an ALSA device.
# It moves no audio, no mixer and no drop-in. It has a stable
# id the plugin mints, a name, the logical outputs it holds,
# and its own EQ, which the plugin stores and answers but does
# not render.
#
# The shelf is stocked by the delivery plugin alongside
# `audio.delivery`, because a zone is nothing but logical
# outputs and the refusal that keeps a zoned logical output
# from being removed needs both registries in one process.
# The plugin reads the logical-output store and writes only
# the zone store.
#
# Reference plugin: `org.evoframework.delivery.alsa` in
# evo-device-audio.

schema_version = 1
rack = "audio"
shelf = "zones"
shape = 1

description = """
A name over one or more logical outputs. `zone.add` makes a
zone, `zone.update` renames it or changes its outputs without
changing its id, `zone.remove` takes it away, and `zone.list`
reads every zone back in id order. A logical output sits in
one zone at most. A zone also stores its own EQ, set by
`zone.set_eq_engaged` and `zone.set_eq_band` and carried in
every zone answer. The shelf publishes one subject,
`evo.audio.zones` / `eq_claim`, saying which zone's EQ the one
`eq_only` cascade hears, if any; `eq_only` stays the one pipe.
No scene.
"""

# ----- Shared rules -----
#
# Ids are minted `zone:<n>` and never reused; a removed zone's
# number is not minted again. A name is trimmed, non-empty, at
# most 64 characters, and unique among zones without regard to
# case; respelling one's own name is allowed. A membership is a
# list of `logical:<n>` ids: at least one; each an id
# `delivery.list_logical_outputs` returns, so a physical
# `hw:N,M` id is refused; each named once; and each in no other
# zone — the zone being updated is not another zone. A refused
# add or update changes nothing. Zones are kept in the plugin's
# state and survive a restart. No subject is published.
#
# Every zone answer is `{ id, name, logical_output_ids, eq }`.
# `eq` is `{ engaged, bands }`: `engaged` is a bool and starts
# false; `bands` is exactly 10, index 0 through 9. Each band is
# `{ freq_hz, gain_db, q }` with `freq_hz` 20 through 20000,
# `gain_db` -15.0 through 15.0, and `q` 0.1 through 30.0 — the
# same ranges as the global EQ on `audio.options`, stated once
# here for this shelf. Each band starts at 1000 Hz, 0 dB, Q
# 1.0. A zone's EQ absent from the plugin's state loads as that
# default; a shorter band list is padded with flat bands; a
# longer list is cut to 10. Changing the name or the membership
# leaves the EQ; setting the EQ leaves the name and the
# membership. The EQ is stored and answered here; whether it
# is heard is the `eq_claim` subject below.

[[requests]]
request_type = "zone.add"
description = """
Make a zone. Payload is
`{ v: 1, name: string, logical_output_ids: [string] }`.
Answers `{ v: 1, zone: { id, name, logical_output_ids, eq } }`,
that zone only, with the id minted `zone:<n>` and never
reused, and the EQ off and flat. The name is trimmed, non-empty, at most 64 characters,
and unique among zones without regard to case; an empty,
over-long or taken name is refused. The membership holds at
least one id: an empty list is refused. Each id must be a
logical output `delivery.list_logical_outputs` returns — a
physical `hw:N,M` id is refused — named once in the list, and
in no other zone; an unknown id, an id named twice, and an id
another zone holds are each refused, and the refusal of a held
id names that zone. The logical outputs and the physical
outputs are untouched.
"""

[[requests]]
request_type = "zone.update"
description = """
Rename a zone, change its membership, or both. Payload is
`{ v: 1, id: string, name?: string, logical_output_ids?:
[string] }`. The id stays. A new `name` follows the same rules
as on add, and respelling one's own name is allowed. A new
`logical_output_ids` follows the same rules as on add, and
the zone being updated is not another zone: its own outputs
may be kept or reordered. An update that names neither is
refused, and so is an unknown zone id. Answers
`{ v: 1, zone: { id, name, logical_output_ids, eq } }` as the
zone is now; the EQ is left as it was. A refused update
changes nothing.
"""

[[requests]]
request_type = "zone.remove"
description = """
Take a zone away. Payload is `{ v: 1, id: string }`; an unknown
id is refused. Answers `{ v: 1, zone: { id, name,
logical_output_ids, eq } }`, the zone that was taken away. The
logical outputs it held stay as they are and may join another
zone; the physical outputs stay as they are; the id is never
minted again.
"""

[[requests]]
request_type = "zone.list"
description = """
Read the zones back. Payload is `{ v: 1 }`. Answers
`{ v: 1, zones: [{ id, name, logical_output_ids, eq }] }`,
every zone in id order; an empty set is `[]`. The read changes
nothing.
"""

[[requests]]
request_type = "zone.set_eq_engaged"
description = """
Engage or release a zone's EQ. Payload is
`{ v: 1, id: string, engaged: bool }`; an unknown zone id is
refused before any write. Answers
`{ v: 1, zone: { id, name, logical_output_ids, eq } }` with
`eq.engaged` as asked; the bands, the name and the membership
stay. Stored and answered only: the plugin does not render the
zone EQ, and what the operator hears does not change.
"""

[[requests]]
request_type = "zone.set_eq_band"
description = """
Set one band of a zone's EQ. Payload is
`{ v: 1, id: string, index: u32, freq_hz: u32, gain_db: f32,
q: f32 }`. An unknown zone id is refused before any write. An
`index` outside 0 through 9 is refused. A `freq_hz`, `gain_db`
or `q` outside the range stated in the shared rules above is
refused, and the refusal names the field. On any refusal the
zone stays as it was. Answers
`{ v: 1, zone: { id, name, logical_output_ids, eq } }` with
that band as asked; the other nine bands, `engaged`, the name
and the membership stay. Stored and answered only: the plugin
does not render the zone EQ.
"""

[[subjects]]
addressing = { scheme = "evo.audio.zones", value = "eq_claim" }
subject_type = "audio_zone_eq_claim"
description = """
Which zone's EQ the one `eq_only` cascade hears. The state is
one of two shapes. `{ v: 1, claimed: false }` means the options
EQ sounds. `{ v: 1, claimed: true, zone_id, engaged: true,
bands }` means the one `eq_only` cascade in composition.alsa
uses those bands, engaged; `bands` is exactly 10, each
`{ freq_hz, gain_db, q }` in the ranges the shared rules state.
Any other shape, and an absent subject, mean the options EQ.

The claim is true only while one physical output is the
terminus `delivery.play_output` treats as playing, and exactly
one zone with `engaged` true holds a logical output that points
at it. A silent terminus, an unengaged zone, and two engaged
zones on that terminus are `{ claimed: false }`. Announced at
load; updated whenever the playing terminus, a zone's EQ or
membership, or a logical output's target changes; an unchanged
claim is not republished. While the claim is true the options
EQ stays stored as it is and supplies no coefficients; when it
drops the options EQ sounds again. A zone's bands are applied
in no mode but `eq_only`. The composition plugin reads this
subject and nothing of the zone store.
"""

# Acceptance criteria a plugin claiming to satisfy this shape
# MUST meet.
[[acceptance]]
name = "zones-membership-is-logical-outputs-only"
detail = "Every id in a zone's membership is a logical output the `audio.delivery` shelf returns from `delivery.list_logical_outputs`. A physical `hw:N,M` id, an unknown id, and an empty membership are refused on `zone.add` and on `zone.update`."

[[acceptance]]
name = "zones-one-zone-per-logical-output"
detail = "A logical output sits in one zone at most. `zone.add` and `zone.update` refuse an id another zone holds and name that zone; an id named twice in one list is refused. The zone being updated is not another zone. The membership check and the zone write happen under one read lock on the logical-output store, so a logical output cannot be removed between the two."

[[acceptance]]
name = "zones-remove-leaves-outputs"
detail = "`zone.remove` takes the zone away and answers it. It writes nothing but the zone store: the logical outputs it held and the physical outputs stay as they are. The plugin does not cascade a zone edit from any other verb."

[[acceptance]]
name = "zones-ids-minted-never-reused"
detail = "Ids are `zone:<n>`, minted in creation order, and never reused after a remove. `zone.update` keeps the id. `zone.list` answers in id order, whatever order the state file holds."

[[acceptance]]
name = "zones-eq-stored-and-heard-through-eq-claim"
detail = "A zone carries a name, a membership and its own EQ: `engaged` starting false and exactly 10 bands in the ranges the shared rules state, starting flat. `zone.set_eq_engaged` and `zone.set_eq_band` set it; every zone answer carries it; a missing EQ loads as the default, a short band list is padded flat and a long one is cut to 10. An unknown zone, an index outside 0 through 9 and a field outside its range are refused before any write, naming the field. The plugin stores and answers the zone EQ and publishes the `eq_claim` subject; the one `eq_only` cascade in composition.alsa hears the claimed zone's bands from that subject while the claim is true, and the options EQ otherwise. There is one cascade. No scene is stored."
