# Schema for the `audio.delivery` shelf at shape version 2.
#
# Delivery plugins occupy the terminal stage of the audio
# data plane: source → composition → delivery → DAC. The
# framework configures topology (endpoint substrate +
# negotiated format) and hands the delivery plugin a typed
# `ReadEndpoint` via `LoadContext::audio_routing`. Audio
# bytes flow through the OS-native primitive the framework
# selected (ALSA pcm, named pipe, shared-memory region);
# they NEVER traverse the wire protocol or any SDK callback.
#
# A delivery plugin declares `[capabilities.delivery]` with
# `input_kind`, `device`, an `exclusive_mode` flag, a
# `bit_perfect_capable` flag, and a non-empty list of
# accepted `[[capabilities.delivery.audio_formats]]`. The
# reconciliation engine intersects this list with each
# source-produced format set and applies operator policy
# (preferred topology, bit-perfect priority) to pick one
# format per topology rewire.
#
# The respondent surface exposes operator-facing
# introspection of the host's audio hardware: which cards /
# mixers / formats are present at runtime. The settings
# layer (publisher: `audio.options`) drives this plugin via
# the same surface to bind a chosen output device. Audio
# byte processing is implicit — the plugin's worker drives
# the ReadEndpoint continuously while admitted; route
# changes trigger the registered `RouteChangeCallback` so
# the worker can close + reopen at the new format.
#
# Reference plugin: `org.evoframework.delivery.alsa` in
# evo-device-audio (owns the modular `pcm.evo` chain;
# subscribes to the `audio.options` settings subject for
# reactive operator-driven reconfiguration).

schema_version = 1
rack = "audio"
shelf = "delivery"
shape = 2

description = """
Audio data plane terminal delivery stage. The framework
configures endpoint substrate + negotiated format; the
plugin opens the configured OS-native ReadEndpoint and
streams audio bytes through to the local DAC. Plugins
declare typed format lists; the reconciliation engine
selects one format per topology. The respondent surface
exposes operator-facing hardware introspection; the
audio.options settings subject drives reactive
reconfiguration. Substrate handles audio byte flow.
`delivery.enable_output`, `delivery.disable_output`,
`delivery.set_output_volume`, `delivery.play_output` and
`delivery.pause_output` each act on one output
`delivery.list_outputs` names and leave the others as they
are.
"""

# Request types the framework dispatches against this
# shelf. Delivery plugins are respondents at the request
# layer for operator-facing hardware introspection; their
# primary audio work happens implicitly in a worker driving
# the ReadEndpoint.
[[requests]]
request_type = "delivery.probe_hardware"
description = """
Probe the host's audio hardware via libasound (or the
platform equivalent) and return a snapshot of available
cards, mixers, supported formats. Operator-facing
diagnostic; not part of the audio byte path.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "delivery.list_cards"
description = """
Return the enumerated list of audio cards present on the
host. Operator-facing surface for binding a specific card
through the settings subject; not part of the audio byte
path.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "delivery.list_mixers"
description = """
Return the enumerated list of mixer controls available on
the active card. Operator-facing surface for binding a
specific mixer through the settings subject.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "delivery.active_endpoint"
description = """
Return the currently-bound endpoint (device path + format)
the plugin is delivering to. Operator-facing introspection;
sourced from the plugin's internal state, not the audio
hardware directly.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "delivery.list_outputs"
description = """
Return the resolved ALSA outputs list captured at plugin
load: every (card, subdevice) pair `aplay -l` reported,
joined against the plugin's embedded card-name catalog so
each row carries an operator-friendly label, a derived
output class (I2S / HDMI / Analog / SPDIF / USB / Bluetooth
/ Unknown), and the default ALSA mixer control. Operator-
facing surface for the UI's output-device picker. The same
data is also published on the `audio_delivery_outputs`
subject; this verb returns it as a one-shot read.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

# ----- Five verbs on one output -----
#
# Each names one output by the `hw:N,M` id
# `delivery.list_outputs` gives it, and touches that output
# only. Any other id is refused. Each answers
# `{ v: 1, output: { output_id: string, enabled: bool,
# playing: bool, volume: u32 | null } }` for that output and
# no other. `playing` means the chain terminates at that
# output. With no binding the chain follows the operator's
# output device, and that output counts as playing. The
# binding is not kept across a restart; enabled flags and
# accepted volumes are.

[[requests]]
request_type = "delivery.enable_output"
description = """
Let one output play. Payload is `{ v: 1, output_id: string }`,
the `hw:N,M` id `delivery.list_outputs` names; any other id is
refused. Answers `{ v: 1, output: { output_id, enabled: true,
playing, volume } }` for that output only. Enabling an output
does not play it and changes no other output. The flag is
kept in the plugin's state and survives a restart.
"""

[[requests]]
request_type = "delivery.disable_output"
description = """
Stop one output from playing. Payload is
`{ v: 1, output_id: string }`; an id `delivery.list_outputs`
does not name is refused. Answers `{ v: 1, output: {
output_id, enabled: false, playing: false, volume } }` for
that output only. Disabling the output that is playing pauses
it and leaves a silent terminus; no other output starts.
Disabling any other output changes nothing else. The flag is
kept in the plugin's state and survives a restart.
"""

[[requests]]
request_type = "delivery.set_output_volume"
description = """
Set one output's volume. Payload is
`{ v: 1, output_id: string, volume: u32 }`, `volume` 0
through 100; 101 is refused, and so is an id
`delivery.list_outputs` does not name. The volume is one
mixer set on that output's own default mixer control. Answers
`{ v: 1, output: { output_id, enabled, playing, volume } }`
with the level the card accepted; a level the card refuses
fails the verb and is not recorded. An output with no mixer
control is refused. When that control is the chain's hardware
mixer, the verb refuses and names the global volume: the
global volume stays the global volume and is set where it
always was. A software mixer is not that refusal. An accepted
volume is kept in the plugin's state and survives a restart.
No other output's level moves.
"""

[[requests]]
request_type = "delivery.play_output"
description = """
Bind the chain to one output. Payload is
`{ v: 1, output_id: string }`; an id `delivery.list_outputs`
does not name is refused. Answers `{ v: 1, output: {
output_id, enabled, playing: true, volume } }` for that
output only. The chain has one terminus, so one output plays
at a time: a play while another output is playing is refused
and the first keeps playing. A disabled output cannot play
and is refused. Playing the output that is already playing
changes nothing. The binding is not kept across a restart;
after a restart the chain follows the operator's output
device again.
"""

[[requests]]
request_type = "delivery.pause_output"
description = """
Take the chain off one output. Payload is
`{ v: 1, output_id: string }`; an id `delivery.list_outputs`
does not name is refused. Answers `{ v: 1, output: {
output_id, enabled, playing: false, volume } }` for that
output only. Pausing the output that is playing leaves a
silent terminus: that output goes quiet and no other output
starts in its place. Pausing an output that is not playing
changes nothing and pauses no other. The binding is not kept
across a restart.
"""

[[subjects]]
addressing = { scheme = "evo.audio.delivery", value = "outputs" }
subject_type = "audio_delivery_outputs"
description = """
Resolved ALSA outputs list captured at plugin load. Each
row carries the runtime (card, subdevice) identity, the
raw ALSA card name as the kernel reported it, the
canonical `hw:N,M` identifier, an operator-friendly label
resolved against the plugin's embedded card catalog (with
fallback to the raw card name when the catalog has no
matching row), a derived output class (I2S / HDMI / Analog
/ SPDIF / USB / Bluetooth / Unknown), the default ALSA
mixer control name (when the catalog declares one), and
flags for catalog provenance and per-subdevice visibility.
State refreshes on every plugin load. Hot-plug re-
publish and operator-gestured refresh land in a follow-on
chunk; v2 ships the boot-state snapshot.
"""

# Acceptance criteria a plugin claiming to satisfy this
# shape MUST meet.
[[acceptance]]
name = "delivery-engages-audio-routing"
detail = "Plugin consumes `LoadContext::audio_routing` at load time; refuses load loudly when `None`. The framework hands a `Some` only to plugins whose manifest declares `[capabilities.delivery]`, so `None` indicates a manifest / trust misconfiguration that must surface, not be silently swallowed."

[[acceptance]]
name = "delivery-declares-typed-formats"
detail = "Plugin declares a non-empty `[capabilities.delivery]` block with `input_kind`, `device`, and a non-empty `audio_formats` array. The reconciliation engine refuses to admit plugins with empty format lists."

[[acceptance]]
name = "delivery-honours-bit-perfect-claim"
detail = "Plugins declaring `bit_perfect_capable = true` MUST route audio bytes through a stage that preserves them byte-identically (typically pinned to a direct `hw:` ALSA PCM, no `plug` conversion). Plugins declaring `false` may rely on automatic format conversion (the `plug` substrate, equivalent platform mechanisms) and the topology validator refuses bit-perfect chains through such plugins."

[[acceptance]]
name = "delivery-reacts-to-route-change"
detail = "Plugin registers a `RouteChangeCallback` via `AudioRouting::on_route_change` at load. On every framework-fired route change, the plugin closes the old endpoint, calls `read_endpoint()` for the new endpoint, and reopens the OS-native primitive at the new format before resuming byte flow."

[[acceptance]]
name = "delivery-no-audio-bytes-on-wire"
detail = "Audio bytes flow exclusively through the OS-native primitive identified by the endpoint; the plugin MUST NOT serialise audio bytes onto any SDK callback, request response, or wire transport. Operator-facing introspection (probe / list / active_endpoint) returns control-plane facts only."

[[acceptance]]
name = "delivery-subscribes-options-subject"
detail = "Plugin declares `capabilities.subscribe_subjects = true` and at load time subscribes to the `audio.options.settings` subject published by `org.evoframework.playback.options`. Operator changes (output_device / mixer_type / exclusive_mode / etc.) drive reactive reconfiguration without admission churn."

