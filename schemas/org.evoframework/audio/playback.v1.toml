# Schema for the `audio.playback` shelf at shape version 1.
#
# Playback shelves host warden-shape plugins. A warden owns
# a resource (the local audio playback device) and exposes
# `course_correct` verbs for state-transition operations
# (play / pause / stop / next / previous / seek /
# set_volume). Reference plugin:
# `org.evoframework.playback.mpd` in evo-device-audio.
#
# WARDEN SHAPE — note this schema differs from respondent
# shelves. Wardens do not declare `request_types`; they
# declare `course_correct_verbs`. The framework gates
# dispatch at the router against this declared verb set.

schema_version = 1
rack = "audio"
shelf = "playback"
shape = 1
shape_kind = "warden"

description = """
Playback warden — owns the local audio playback device and
exposes course_correct verbs for play / pause / stop /
next / previous / seek / set_volume state transitions.
Wardens are single-claimant per shelf; consumers route
playback intent through the framework's admission boundary,
never directly to the warden.
"""

# course_correct verbs this shelf accepts. The warden's
# manifest declares
# `capabilities.warden.course_correct_verbs`; the framework
# refuses any verb not in the declared set at the router
# boundary before the warden's `course_correct` body is
# invoked.
course_correct_verbs = [
    "play",
    "pause",
    "stop",
    "next",
    "previous",
    "seek",
    "seek_by_delta",
    "set_volume",
    "set_mute",
    "set_repeat",
    "set_shuffle",
    "set_single",
    "set_consume",
    "emit_test_tone",
]

# Per-verb payload contracts. Payloads travel as opaque
# bytes; the warden parses them in its `course_correct`
# body. The shapes below describe the encoding the
# reference plugin honours and the contract every
# warden on this shelf is expected to match.
[[verbs]]
name = "play"
payload_in = """
Empty payload starts playback at the current queue position
(resumes from pause if applicable, plays from position 0 if
the queue is fresh). Optional non-empty payload is a
zero-based queue position rendered as an unsigned decimal
integer (UTF-8 ASCII), e.g. `"3"` plays the 4th queued
item.
"""
payload_out = "empty"

[[verbs]]
name = "pause"
payload_in = """
UTF-8 ASCII boolean flag selecting pause vs unpause:
`"1"` / `"true"` pauses playback; `"0"` / `"false"`
unpauses. Empty payload is rejected with a structured
contract refusal.
"""
payload_out = "empty"

[[verbs]]
name = "stop"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "next"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "previous"
payload_in = "empty"
payload_out = "empty"

[[verbs]]
name = "seek"
payload_in = """
Absolute position from the current track's start, expressed
in milliseconds as an unsigned decimal integer (UTF-8
ASCII), e.g. `"1250"` seeks to 1.25 seconds. The warden
clamps the value to the track's duration.
"""
payload_out = "empty"

[[verbs]]
name = "set_volume"
payload_in = """
Linear volume percentage in 0..=100, expressed as an
unsigned decimal integer (UTF-8 ASCII), e.g. `"50"`. Values
outside the range are clamped by the warden.
"""
payload_out = "empty"

[[verbs]]
name = "seek_by_delta"
payload_in = """
Signed millisecond offset applied relative to the current
playback position, expressed as a decimal integer (UTF-8
ASCII) with optional leading sign, e.g. `"-5000"` rewinds
5 s, `"+15000"` fast-forwards 15 s, `"30000"` (no sign)
fast-forwards 30 s. The warden clamps the resulting absolute
position to the track's bounds (0 floor, duration ceiling).
A delta that lands at or before 0 seeks to the track start.
"""
payload_out = "empty"

[[verbs]]
name = "set_mute"
payload_in = """
UTF-8 ASCII boolean flag selecting mute vs unmute:
`"1"` / `"true"` mutes (drops volume to 0; the warden
captures the pre-mute volume for restore); `"0"` / `"false"`
unmutes (restores the captured pre-mute volume; if no prior
value was captured the warden restores to a 50% fallback).
Empty payload is rejected with a structured contract
refusal. The mute state is reflected in the `now_playing`
subject's `muted` field; subscribers should not infer mute
from `volume == 0` because the operator may legitimately
choose 0 as a non-muted setting.
"""
payload_out = "empty"

[[verbs]]
name = "set_repeat"
payload_in = """
UTF-8 ASCII boolean flag toggling queue-repeat mode:
`"1"` / `"true"` enables; `"0"` / `"false"` disables. Maps
to MPD's `repeat on/off` primitive — when enabled, MPD
restarts the queue from position 0 after the last song ends.
Empty payload is rejected with a structured contract
refusal. State surfaces in `now_playing.repeat`.
"""
payload_out = "empty"

[[verbs]]
name = "set_shuffle"
payload_in = """
UTF-8 ASCII boolean flag toggling shuffle (random) mode:
`"1"` / `"true"` enables; `"0"` / `"false"` disables. Maps
to MPD's `random on/off` primitive — when enabled, MPD plays
queue entries in random order. Empty payload is rejected.
State surfaces in `now_playing.shuffle` (the operator-facing
field name; the MPD primitive is `random`).
"""
payload_out = "empty"

[[verbs]]
name = "set_single"
payload_in = """
UTF-8 ASCII boolean flag toggling single-track-loop mode:
`"1"` / `"true"` enables; `"0"` / `"false"` disables. Maps
to MPD's `single on/off` primitive — when enabled, MPD stops
after the current song instead of advancing (combined with
`repeat`, this becomes single-track loop). Empty payload is
rejected. State surfaces in `now_playing.single`.
"""
payload_out = "empty"

[[verbs]]
name = "set_consume"
payload_in = """
UTF-8 ASCII boolean flag toggling consume mode:
`"1"` / `"true"` enables; `"0"` / `"false"` disables. Maps
to MPD's `consume on/off` primitive — when enabled, MPD
removes each song from the queue after it plays. Empty
payload is rejected. State surfaces in `now_playing.consume`.
"""
payload_out = "empty"

[[verbs]]
name = "get_now_playing"
payload_in = """
Empty payload (or bare envelope `{ "v": 1 }`). Read-only
verb — returns the warden's current now-playing state without
mutating it. Distinct from the now_playing subject's update
stream: the subject only emits state on transitions, so a
fresh subscriber sees nothing until the next play / pause /
seek / etc. This verb returns the current state on demand so
UI surfaces can render their initial frame without waiting
for a transition.

Custody acquisition: dispatching this verb triggers the
framework's request-op warden-custody bootstrap on the
playback warden, identical to dispatching any transport
verb. After this read the warden's supervisor is live; the
now_playing subject begins emitting on subsequent
transitions; the standard subject-subscribe path delivers
deltas.
"""
payload_out = """
UTF-8 JSON payload carrying the same shape as the
`now_playing` subject's state — `{ v, transport_state,
track, elapsed_ms, duration_ms, volume, muted, repeat,
shuffle, single, consume }`. Field semantics, null
conventions, and the `mpd_path` walk to track/album
subjects are documented under the now_playing subject
below.

Consumers SHOULD read once on connect and subscribe to the
now_playing subject in the same operation (the
read-then-subscribe pattern) — first render renders from the
read; subsequent updates render from the subscription.
"""

[[verbs]]
name = "emit_test_tone"
payload_in = """
Operator-facing wiring diagnostic. The warden synthesises a
sine wave at the requested frequency and emits it through the
full playback chain (composition + delivery + DAC) for the
requested duration, then returns silence. The channel-routing
arg selects left-only / right-only / both-channels emission so
the operator can confirm channel mapping at the DAC physical
output (left-only test tone with audible right output =
miswired channels). Payload is a UTF-8 JSON object with the
following fields (all optional, defaults documented):

  {
    "v": 1,
    "freq_hz": 1000,
    "duration_ms": 1500,
    "channel": "both"
  }

`freq_hz` accepts 20..=20000 (audible band); values outside
the range refuse with a structured Permanent error.
`duration_ms` accepts 100..=10000; the upper bound catches
slider-typo + UI-bug excursions, the lower bound ensures the
tone is operator-perceptible. `channel` is one of {`left`,
`right`, `both`}; any other string refuses. The verb returns
once the synthesis is enqueued; the warden continues to honour
operator gestures (stop / next / etc.) during emission, so a
mistakenly-started test tone is operator-interruptible without
waiting for `duration_ms` to elapse.
"""
payload_out = "empty"

# Acceptance criteria a plugin claiming to satisfy this
# shape MUST meet. The framework does not enforce these at
# admission (no runtime assertion harness yet); they
# document what a future shape-conformance test would
# check.
[[acceptance]]
name = "warden-single-claimant"
detail = "Only one playback warden may be admitted to this shelf at a time. Cardinality refused at admission."

[[acceptance]]
name = "warden-non-panic-on-dependency-loss"
detail = "Warden survives dependency loss (audio device unavailable, ALSA driver crash, MPD daemon exit) without panicking. Returns structured error to in-flight ops; the steward sees a typed warden refusal rather than a process abort."

[[acceptance]]
name = "warden-course-correct-gated"
detail = "Framework refuses any course_correct verb not in the manifest's declared `capabilities.warden.course_correct_verbs` list. Tested at admission via manifest-drift checks."

[[acceptance]]
name = "warden-payload-versioning-by-encoding"
detail = "Payloads are versioned by their encoding contract per verb (above). A breaking encoding change is a shape bump; additive payload extensions (new optional fields, additional acceptable forms) ride at the same shape."

[[acceptance]]
name = "warden-volume-clamping"
detail = "set_volume payloads outside the 0..=100 range are clamped, not rejected. Matches the operator-experience principle that a slider value at the extreme end behaves as the extreme rather than failing the dispatch."

[[acceptance]]
name = "emit-test-tone-exercises-full-playback-chain"
detail = "The `emit_test_tone` verb synthesises a sine wave and routes it through the SAME composition + delivery + DAC chain that real audio playback uses (not a side-channel `speaker-test` invocation). This is the operator-facing wiring diagnostic: if the test tone is silent the chain itself is broken, not just one playable file. The warden writes the synthesised PCM to a temp file and dispatches an internal LoadAndPlay command so the full pcm.evo → composition → delivery topology is exercised."

[[acceptance]]
name = "emit-test-tone-channel-routing-domain"
detail = "The `channel` arg accepts {`left`, `right`, `both`} only. Any other string refuses with a structured Permanent error naming the offending value + the accepted domain. The warden synthesises a stereo PCM where left-only fills only the L channel with zero in R, right-only the reverse, both-channels carries the sine in both channels with equal amplitude. Operators use the L/R split to verify channel mapping at the DAC physical output."

[[acceptance]]
name = "emit-test-tone-frequency-and-duration-bounds"
detail = "`freq_hz` must lie in 20..=20000 (audible band); refusal carries the offending value + the accepted band. `duration_ms` must lie in 100..=10000; refusal names the offending value + the accepted range. The bounds protect against operator typos (e.g. 100000 Hz inaudible / 100000 ms ten-second-tone) while keeping the operator-perceptible range fully covered."

[[acceptance]]
name = "now-playing-published-on-load-and-every-state-transition"
detail = "The warden announces the `now_playing` subject (addressing `{ scheme = 'evo.audio.playback', value = 'now_playing' }`, subject_type `audio_playback_now_playing`) on load and updates it on every playback state transition (play, pause, stop, track change, seek, set_volume, set_mute, set_repeat, set_shuffle, set_single, set_consume) and on every MPD idle wake. The state payload carries `{ v, transport_state, track, elapsed_ms, duration_ms, volume, muted, repeat, shuffle, single, consume }` where `transport_state` is one of `\"playing\" | \"paused\" | \"stopped\"`, `track` is null when stopped or no current song, else `{ title, artist, album, mpd_path }` (UI walks `mpd_path` to the `track` / `album` subjects for artwork), `elapsed_ms` and `duration_ms` are null when stopped or unknown, `volume` is 0..=100, `muted` reflects the warden's mute-toggle state (not derived from `volume == 0`), and `repeat / shuffle / single / consume` reflect the MPD mode primitives. The subject is the single source of truth for transition deltas; out-of-band sidecar channels are forbidden. NOTE: the framework's subject-subscribe machinery does NOT replay the current state as the first event to a new subscriber — `subject_state_changed` fires only on subsequent transitions. Consumers needing first-render state use the `get_now_playing` read verb (see verbs section) in the canonical read-then-subscribe shape: read once on connect for the initial frame, subscribe to the subject for deltas. Live elapsed-ms advancement between transitions is consumer-side: the consumer interpolates locally from the last reported `elapsed_ms` + wall-clock while `transport_state == \"playing\"`."

[[acceptance]]
name = "get-now-playing-read-verb-supports-first-render"
detail = "The warden honours a `get_now_playing` read request_type that returns the current `now_playing` payload synchronously. The verb is read-only (no playback mutation, no queue change) and is the sanctioned surface for first-render state on freshly-connected UI clients. Because the verb is declared in the plugin's respondent.request_types, dispatching it triggers the framework's request-op warden-custody bootstrap so a read works before any transport verb has been issued — the supervisor spawns, queries MPD's current state, and replies. Repeated reads are idempotent and cheap (one MPD `status` + `currentsong` round-trip). Consumers MUST use the read-then-subscribe shape (`get_now_playing` once on connect, subscribe to the now_playing subject for deltas) rather than polling the read verb."

[[acceptance]]
name = "mpd-cycles-output-on-asound-composition-change"
detail = "The warden's supervisor watches `/etc/asound.d/` for create/modify/delete/rename events and, on any change, cycles MPD output 0 via the MPD wire protocol (`disableoutput 0` followed by `enableoutput 0`). The cycle causes MPD to close its current `snd_pcm_t` handle and reopen with the next PCM-open's re-resolved `pcm.evo`, picking up additive drop-ins (resampler, EQ, multi-room loopback, room correction, etc.) without a systemd unit bounce. The warden MUST NOT invoke `systemctl restart mpd` for asound composition changes; output-cycle is the canonical primitive. Failure modes: a missing `/etc/asound.d/` directory at admit time MUST be created (mode 0775, owner root:<service-user>) so the watcher always has a path to inotify; a transient watcher error MUST self-heal by re-arming the inotify descriptor without dropping the supervisor."

[[acceptance]]
name = "stream-format-published-on-load-and-every-format-change"
detail = "The warden announces the `stream_format` subject (addressing `{ scheme = 'evo.audio.playback', value = 'stream_format' }`, subject_type `audio_playback_stream_format`) on load and updates it on every audio-format change (track transition with different rate, gapless transition into a different-rate track, MPD reopen at a different format, source-pcm vs source-dsd switch). The state payload carries `{ v, effective, source }` where `effective` is the AudioFormat reaching the DAC after resampling + DoP wrapping and `source` is the AudioFormat MPD decoded from the file (null when source isn't separately knowable; subscribers treat null as 'source = effective'). AudioFormat round-trips the evo-plugin-sdk `AudioFormat` serde representation — PCM `{ kind, codec, rate_hz, channels }`, DSD `{ kind, rate, transport, channels }`, EncodedPassthrough `{ kind, codec, rate_hz, channels }`. The subject is the single source of truth for the live stream format; out-of-band format channels (parallel wire ops, sidecar events, format fields crammed into `track`) are forbidden."

# Subjects the warden announces. Consumers (operator UI's
# format display, future loggers / auditors) resolve the
# addressing below against the framework's subject querier
# and subscribe via SubjectStateSubscriber.

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "now_playing" }
subject_type = "audio_playback_now_playing"
description = """
Live now-playing state the warden is driving. Updates on every
playback state transition (play, pause, stop, track change,
seek, volume change, mute toggle, mode-flag changes) and on
every MPD idle wake. Updates are delta-only — see "First-render
state" below.

Payload shape (v1):

  {
    "v": 1,
    "transport_state": "playing" | "paused" | "stopped",
    "track": null | {
      "title":   string | null,
      "artist":  string | null,
      "album":   string | null,
      "mpd_path": string
    },
    "elapsed_ms":  u64 | null,
    "duration_ms": u64 | null,
    "volume":      u8,                 // 0..=100
    "muted":       bool,
    "repeat":      bool,
    "shuffle":     bool,               // MPD's `random` mode
    "single":      bool,               // single-track stop / loop
    "consume":     bool                // remove-on-play
  }

`track` is null when stopped or when MPD reports no current
song. `elapsed_ms` and `duration_ms` are null when stopped or
when MPD does not report the value (streams, some CD rips).
`muted` reflects the warden's explicit mute state; subscribers
MUST NOT derive mute from `volume == 0` because the operator
may legitimately choose 0 as a non-muted setting. `mpd_path`
is the addressing-value the UI walks to the `track` / `album`
subjects for artwork and richer metadata.

First-render state. The framework's subject-subscribe
machinery does NOT replay the current state as the first
event to a new subscriber — `subject_state_changed` fires
only on subsequent transitions. Consumers needing first-render
state use the `get_now_playing` read verb on the warden in
the canonical read-then-subscribe shape: `get_now_playing`
once on connect for the initial frame, subscribe to this
subject for deltas.

Live elapsed advancement. Updates emit only on transitions
and MPD idle wakes; a steadily-playing track produces no idle
event (the playhead advancing is not a subsystem change).
Consumers interpolate `elapsed_ms` locally between updates
(last reported value + wall-clock delta) while
`transport_state == "playing"`.

Transport controls (play / pause / stop / next / previous /
seek / seek_by_delta / set_volume / set_mute / set_repeat /
set_shuffle / set_single / set_consume) dispatch as source
verbs against the warden; the resulting state change emits
on this subject within the dispatch's response window.
"""

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "stream_format" }
subject_type = "audio_playback_stream_format"
description = """
Live audio-stream format the warden is feeding into the
write endpoint. Updates whenever the audio format reaching
the DAC changes (track transition with different rate,
gapless transition into a different-rate track, MPD reopen
at a different format, source-pcm vs source-dsd switch).
Carries both the effective format (post-resampling, post-
DoP-wrapping; what reaches the DAC) and the source format
(what MPD decoded from the file; null when the source isn't
separately knowable). DSD streams carry the transport
discriminant (DoP vs NativeUsb) so the operator UI can show
whether DoP wrapping is active.

Payload shape: `{ v: 1, effective: AudioFormat, source:
AudioFormat | null }` where AudioFormat round-trips the
evo-plugin-sdk `AudioFormat` serde representation.

The subject is the only sanctioned surface for live stream
format; consumers MUST subscribe rather than polling a verb
or recovering from happenings.
"""

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "spectrum_frame" }
subject_type = "audio_playback_spectrum_frame"
description = """
Live real-time spectrum frame the audio terminus is
computing from the post-mixer audio signal. Updates at a
target 30 Hz cadence (tier-adaptive: server-tier devices
may sustain 60 Hz; MCU-tier may step down to 15 Hz on
backpressure; wire shape is constant). The terminus is the
canonical owner of every post-mixer audio-derived signal —
single FFT compute per leader regardless of subscriber
count or source-plugin diversity.

Sampling point. The terminus captures from a parallel
`snd-aloop` tap fed by the multi-slave tee in
`/etc/asound.conf`. Operator-options drop-ins
(delivery.alsa-managed) compose at `pcm.evo` upstream of
the tee, so EQ + replay-gain + rate-conversion + volume
apply BEFORE the terminus reads. Multi-room delay-alignment
applies INSIDE the terminus on the fan-out path so the
spectrum reflects the pre-alignment signal — the same
wavefront every group member plays after their per-member
delay applies. The primary audio path (pcm.evo to
hw:CARD=DAC) is unaffected by terminus health; local DAC
audio cannot be silenced by terminus failure.

Payload shape (v1):

```
{ v:           1,
  bins:        256,
  channels:    2,
  rate_hz:     30,
  magnitudes:  [[256 f32 L], [256 f32 R]],
  peak_hold:   [[256 f32 L], [256 f32 R]],
  onsets:      { sub_bass, bass, mid, high },
  correlation: [256 f32],
  at_ms:       <emit timestamp> }
```

`magnitudes` are mel-scale (perceptual, not linear-FFT) over
the [20 Hz, 20 kHz] audible band, normalised to [0, 1].
Renderers downsample to operator-chosen bin counts (32 /
64 / 128 / 256) and channel-collapse for mono presentation.

`peak_hold` is the per-bin peak decayed at a perceptual
rate (~12 dB/s) — eliminates percussive flicker on the
falling edge of transients while still falling visibly
between sustained-loud passages.

`onsets` are per-band transient-event booleans (sub_bass
20-60 Hz, bass 60-250 Hz, mid 250-2000 Hz, high 2000+ Hz)
fired when the band's spectral flux exceeds the rolling
mean + k * std-dev of its recent history. Renderer presets
that respond to musical events (drum hits, cymbal strikes)
read these instead of magnitude noise.

`correlation` is the per-bin L/R correlation coefficient
(0 = mono content in one channel only, 1 = perfectly
correlated true-stereo). Renderer presets that visualise
stereo imaging (centre-image vs side-image bins, phase
correlation displays) read this.

First-render state. Like every other audio.playback
subject, the framework's subject-subscribe machinery does
not replay the current state as the first event to a new
subscriber. Consumers needing first-render state use the
`get_spectrum_frame` read verb on the audio terminus
(canonical read-then-subscribe shape). Until the first
frame computes (terminus loaded but capture loop not yet
delivered its first FFT), the verb returns an empty-frame
shape (zero magnitudes + zero peak_hold + all-false
onsets + zero correlation + at_ms=0) so renderers handle
the "loading" state with the same code path as silence.
"""

[[acceptance]]
name = "audio-terminus-is-the-single-sink"
detail = "Every post-mixer audio-derived signal MUST be computed at the audio terminus plugin (`org.evoframework.audio.terminus` on the `audio.terminus` shelf). Source plugins (MPD today, AirPlay / Cast / Spotify Connect / streaming-radio in the future) write audio to `pcm.evo`; the terminus sees that audio via a parallel `snd-aloop` tap and owns every onward post-mixer projection (spectrum FFT today; loudness telemetry, fingerprinting, on-device transcription as those land). Source plugins MUST NOT compute their own spectrum or claim ownership of any post-mixer signal under the audio.playback shelf — the terminus is the single canonical owner."

[[acceptance]]
name = "spectrum-payload-v1-shape"
detail = "The `audio_playback_spectrum_frame` subject's state payload at v1 is `{ v: 1, bins: 256, channels: 2, rate_hz: <actual cadence>, magnitudes: [[256 f32], [256 f32]], peak_hold: [[256 f32], [256 f32]], onsets: { sub_bass, bass, mid, high }, correlation: [256 f32], at_ms: <epoch ms> }`. `magnitudes` and `peak_hold` are mel-scale Float32 in [0, 1] over [20 Hz, 20 kHz]. `onsets` booleans fire on per-band spectral-flux threshold crossings. `correlation` is per-bin L/R coefficient in [0, 1] (0 = mono in one channel, 1 = perfectly-correlated true stereo). `rate_hz` reflects ACTUAL cadence (tier-adaptive); the wire shape is constant. Renderers MUST honour the `v` field and refuse unknown versions."

[[acceptance]]
name = "spectrum-leader-authoritative"
detail = "In a multi-room group, only the leader's terminus emits the spectrum subject. Followers MUST NOT publish a parallel `audio_playback_spectrum_frame` subject under the same name. Operator seats subscribed to any member device of the group receive the leader's spectrum — single wavefront, single FFT instance per leader regardless of seat count. The leader-authoritative rule is enforced by the terminus's emit-gate logic, keyed off the leader role surfaced through the framework's RoleStore + MultiroomSubstrateHandle."

[[acceptance]]
name = "spectrum-tier-adaptive-cadence"
detail = "The terminus's target FFT cadence is 30 Hz with backpressure tolerance over [15, 60] Hz. Server-tier devices may sustain 60 Hz; Pi-tier devices target 30 Hz; MCU-tier devices step down to 15 Hz on sustained backpressure. The wire shape and payload fields are CONSTANT across cadences; `rate_hz` reflects ACTUAL observed cadence so renderers can pace their interpolation. Cadence changes MUST NOT introduce stale-frame artefacts (renderers receive every frame in order; missed frames manifest as gaps in `at_ms` not as out-of-order arrival)."

[[acceptance]]
name = "local-playback-floor-invariant-preserved-by-terminus"
detail = "The audio terminus is a PARALLEL slave of the multi-slave tee defined by `pcm.evo` in `/etc/asound.conf` — the primary slave is `hw:CARD=<dac>` (the local DAC), the terminus tap is a secondary slave (`hw:Loopback,DEV=0,SUBDEV=7`). Terminus failure, absence, or crash MUST NOT silence the primary audio path. The local-playback floor invariant (any device, any configuration, no live multi-room group => `pcm.evo` reaches the DAC bit-perfect) is preserved by construction: if the terminus is down the multi-slave tee still writes to the DAC. Rig acceptance for this row plays audio through a fresh-bootstrapped device with the terminus plugin DISABLED via plugin-management; audio MUST be audibly playing on the DAC throughout."

[[acceptance]]
name = "get-spectrum-frame-read-verb-for-first-render"
detail = "The terminus honours a `get_spectrum_frame` read request_type that returns the latest computed spectrum frame synchronously. The verb is read-only (no compute mutation, no subscribe activation) and is the sanctioned surface for first-render state on freshly-connected UI clients (parity with `get_now_playing`). Before the first frame computes (terminus loaded but capture loop yet to deliver), the verb returns an empty-frame shape (zero magnitudes / peak_hold / correlation, all-false onsets, at_ms=0) so renderers handle 'loading' with the same code path as silence. Repeated reads are idempotent. Consumers MUST use the read-then-subscribe shape (`get_spectrum_frame` once on connect for the initial frame, subscribe to the subject for deltas) rather than polling the read verb."
