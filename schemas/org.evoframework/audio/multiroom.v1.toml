# Schema for the `audio.multiroom` shelf at shape version 1.
#
# The audio.multiroom shelf hosts the multi-room audio fan-out
# plugin: source-role admissions capture audio from a local
# PCM (typically a snd-aloop capture half fed by the
# playback chain's audio_output to the matching playback
# half) and fan frames out to receiver-role admissions on
# other devices in the same group over the framework's
# audio plane. Receiver-role admissions render incoming
# frames through their configured ALSA PCM.
#
# Reference plugin: `org.evoframework.multiroom.evo-native`
# in evo-device-audio (the framework's reference
# implementation; vendor distributions may admit alternative
# multi-room plugins targeting the same shelf, e.g. plugins
# bridging external multi-room ecosystems via the
# universal-translator pattern).

schema_version = 1
rack = "audio"
shelf = "multiroom"
shape = 1

description = """
Multi-room audio fan-out shelf. Source-role admissions
capture audio from a local PCM and fan frames out to
receiver-role admissions in the same group via the
framework's audio plane (TCP control + frame channel).
Receiver-role admissions render incoming frames through
their configured ALSA PCM. Single source-role admission
per group; multiple receiver-role admissions composable
under one source.
"""

# Requests this shelf supports. The reference plugin's
# operator surface is exposed through framework-level
# multi-room verbs (`admin group create / add-member /
# source-host show / network connections / dispatch`) plus
# the audible-time-trace read-side wire-op declared below.
[[requests]]
request_type = "audio.multiroom.frame_trace.snapshot"
description = "Returns the most recent rolling-window snapshot of the per-frame audible-time trace for the named group. Source-host-side aggregator publishes the `audio.multiroom.frame_trace` subject (declared below); this verb returns the subject's current value without subscribing. Read-side; capability-gated by `plugins_admin`. The wire-op is the canonical surface for generating multi-room verification evidence (audit traces, per-stage budget tables); operators in CLI-only / headless environments use it directly rather than subscribing to the subject."
payload_in = "tbd-review"
payload_out = "tbd-review"

# Published subjects — read-able surface for UI, operator
# wire-op consumers, and CI assertions.
#
# `audio.multiroom.frame_trace` is published by the
# source-host's multi-room admission, one per group whose
# source-host role is admitted on the local node. The
# subject carries a rolling window of recent per-frame
# audible-time trace records bracketing the six in-code
# stages of the framework's audio path between the source's
# frame capture and the receiver's `writei` return.
# Receiver-role admissions do NOT publish this subject;
# they back-report their per-frame timestamps to the
# source-host over the audio-plane's existing control
# channel via a `FrameTraceReport` message, and the
# source-host aggregates the source-side timestamps with
# each receiver's back-report into one combined record per
# `(sequence, receiver_device_id)` pair before publishing.
#
# Clock reconciliation rides the existing audio-plane
# NTP-lite probe; each record carries the per-peer clock
# offset at the time it was emitted so consumers can
# reconstruct wall-clock-aligned timestamps when comparing
# source-monotonic and receiver-monotonic fields.
#
# Stages 1 (MPD-internal), 2 (kernel snd-aloop loopback),
# and 8 (analog DAC) of `MULTIROOM-DESIGN.md` §6.1 are
# unmeasurable from inside the framework; the six in-code
# stages bracket them. The unmeasured stages surface as
# differences between bracket fields, not as direct
# observations.

[[subjects]]
name = "audio.multiroom.frame_trace"
description = "Rolling-window per-frame audible-time trace for one multi-room group whose source-host role is admitted on the local node. Source-host-aggregated from per-receiver back-reports over the audio-plane control channel. Updated on every observed frame; window size is operator-configurable (default 100 frames). Generated by the canonical wire-op `audio.multiroom.frame_trace.snapshot` for multi-room verification evidence."

[[subjects.fields]]
name = "group_id"
type = "string"
description = "Canonical id of the multi-room group this trace belongs to. Matches the group entity in the source-host's `group_store`."

[[subjects.fields]]
name = "window_size"
type = "u32"
description = "Configured rolling-window size (number of most-recent records retained). Operator-configurable; default 100."

[[subjects.fields]]
name = "records"
type = "array<frame_trace_record>"
description = "Rolling window of per-frame trace records, ordered oldest-first. Each record represents one (sequence, receiver_device_id) tuple; a single frame fanned out to N receivers yields N records (one per receiver)."

[[subjects.fields]]
name = "last_update_at"
type = "system_time"
description = "Timestamp of the most recent record append."

# Per-record fields. Each record bracket six in-code stages
# of the audible-time path.
[[subjects.record_types.frame_trace_record]]
name = "sequence"
type = "u64"
description = "Source-host's per-emit-frame sequence counter at capture-emit time. Unique within the (group, source-host-load-lifetime) tuple."

[[subjects.record_types.frame_trace_record]]
name = "receiver_device_id"
type = "string"
description = "Canonical id of the receiver this record's timestamps were back-reported from. The source-host aggregator keys records by `(sequence, receiver_device_id)`; a single frame fanned to N receivers produces N records."

[[subjects.record_types.frame_trace_record]]
name = "presentation_time_ms"
type = "u64"
description = "Source-host's monotonic presentation-time-ms recorded on the frame at capture-emit time (the value carried in the AudioFrame envelope to receivers)."

[[subjects.record_types.frame_trace_record]]
name = "source_capture_readi_return_ns"
type = "u64"
description = "Source-host monotonic ns at which the capture-thread's `io.readi(&buf)` returned for this frame's chunk. §6.1 stage 3a."

[[subjects.record_types.frame_trace_record]]
name = "source_mpsc_send_ns"
type = "u64"
description = "Source-host monotonic ns at which the capture-thread sent the chunk into the source-task channel. §6.1 stage 3b."

[[subjects.record_types.frame_trace_record]]
name = "source_mpsc_recv_ns"
type = "u64"
description = "Source-host monotonic ns at which the source async task received the chunk from the capture-thread channel. §6.1 stage 4a."

[[subjects.record_types.frame_trace_record]]
name = "source_fanout_enter_ns"
type = "u64"
description = "Source-host monotonic ns at which the source async task invoked `fan_out_audio_frame` for this frame. §6.1 stage 4b."

[[subjects.record_types.frame_trace_record]]
name = "source_wire_send_ns"
type = "u64"
description = "Source-host monotonic ns at which the audio-plane queued the frame onto the per-peer write channel (immediately before TCP serialisation). §6.1 stage 5a."

[[subjects.record_types.frame_trace_record]]
name = "receiver_wire_recv_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's audio-plane decoded the AudioFrame envelope and queued it onto the per-subscriber broadcast channel. §6.1 stage 5b. Receiver-back-reported."

[[subjects.record_types.frame_trace_record]]
name = "receiver_scheduler_dequeue_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's render scheduler dequeued this frame for `writei`. §6.1 stage 6. Receiver-back-reported."

[[subjects.record_types.frame_trace_record]]
name = "receiver_writei_return_ns"
type = "u64"
description = "Receiver monotonic ns at which the receiver's `io.writei(&samples)` returned for this frame. §6.1 stage 7. Receiver-back-reported. Note that `writei` return is NOT analog audible-time; stage 8 (ALSA → DAC analog) is unmeasurable in software."

[[subjects.record_types.frame_trace_record]]
name = "clock_offset_ns"
type = "i64"
description = "Per-peer clock offset at the time this record was emitted, sourced from the audio-plane NTP-lite probe. `source_monotonic - receiver_monotonic`. Consumers reconstructing wall-clock-aligned timestamps subtract this value from receiver-monotonic fields. Captured at record-emit time so retrospective analyses can correct for the offset observed at that frame's transit, not the current one."

# Per-device card envelope subject. One instance per
# device-or-group entity in the household; the multi-room
# plugin's source-host admission publishes the envelope for
# every device + group it is the source-host for, and the
# receiver-side admission publishes for itself when it is
# not under a source-host's care. Together the household's
# `audio.multiroom.device_card` subject instances cover
# every device + group an operator's UI would render on the
# multi-room shelf.
#
# The envelope shape is the realisation of the universal
# collection presentation pattern (see the public design-doc
# mirror) for the multi-room domain — state-to-visual
# mapping per transport state, unified shape across solo /
# group / subgroup / master cases, reactive subject binding
# so the UI receives transitions within sub-second of the
# underlying event without polling. Cards consume one
# instance each; widget kinds rendering them live in the
# multi-room plugin's manifest.
#
# Subject naming: instances are keyed `audio.multiroom.
# device_card/<device_or_group_id>` (the subject-substrate's
# generic instance-keying pattern). Consumers subscribe to
# the type and receive every instance update; the
# `device_or_group_id` field discriminates.

[[subjects]]
name = "audio.multiroom.device_card"
description = "Per-device-or-group card envelope for the multi-room UI shelf. One instance per entity in the household; updated reactively on every underlying event (transport state, group membership, source-host election, clock-sync state, peer connection). The unified shape across solo / group / subgroup / master cases keeps the rendering surfaces one envelope; consumers discriminate by `transport_state` and the optional `master_group_context`."

[[subjects.fields]]
name = "device_or_group_id"
type = "string"
description = "Canonical id of the device or group this card represents. For solo devices: the device's own canonical id. For groups: the group's canonical id (the group entity in the source-host's `group_store`). Subject-instance key; uniquely identifies the card within the household."

[[subjects.fields]]
name = "display_name"
type = "string"
description = "Operator-visible name. Devices: the operator-editable display name from `admin device identity show`. Groups: the operator-supplied display name from `admin group create / rename`."

[[subjects.fields]]
name = "state_badge"
type = "state_badge"
description = "Operator-visible state badge per the universal state-to-visual mapping. Discriminates between Solo, Leader-of-group, Member-of-group, Subgroup-of-master, Master-group, and the transport-state-specific badges (Stopped / Idle / Offline / Unpaired / Revoked)."

[[subjects.fields]]
name = "transport_state"
type = "transport_state"
description = "Current transport state of the entity. Drives card content per the state-to-visual mapping: Playing / Paused render live artwork + title; Stopped / Idle / Offline / Unpaired / Revoked render the theme-placeholder + the corresponding state badge."

[[subjects.fields]]
name = "current_track"
type = "option<track_summary>"
description = "Track currently loaded on the entity, when transport_state is Playing or Paused. None for Stopped / Idle / Offline / Unpaired / Revoked. The artwork-or-icon fallback (when artwork_url is None) honours the universal artwork-first-or-icon rule."

[[subjects.fields]]
name = "theme_placeholder_artwork_url"
type = "string"
description = "URL of the theme-contributed device-placeholder artwork. Rendered when transport_state is Stopped / Idle / Offline / Unpaired / Revoked, or when current_track.artwork_url is None. Per-device themed (the operator's chosen aesthetic propagates to the multi-room view); a missing theme falls back to the framework-default neutral evo glyph."

[[subjects.fields]]
name = "master_group_context"
type = "option<master_group_context>"
description = "Set when the entity is a member of a master group (subgroup extension lands in a follow-on release). Carries the master group's id + display name and the operator-configured per-member delay readback alongside the audible-time-honest computed delay. None in the current release (flat groups only)."

[[subjects.fields]]
name = "last_update_at"
type = "system_time"
description = "Wall-clock timestamp of the last envelope refresh. Operator surfaces render `<n>s ago` style staleness indicators; reactive consumers ignore the field (they receive transitions on the underlying happenings)."

# Track summary record. Populated only when transport_state is
# Playing or Paused. The artist + album fields exist for
# richer overlay variants; cards may render them or hide
# them per their view-mode (List view typically renders
# title + state-badge; Tile view typically renders artwork
# + title overlay).
[[subjects.record_types.track_summary]]
name = "artwork_url"
type = "option<string>"
description = "URL of the track artwork. Served by the framework's HTTPS artwork endpoint with a size discriminator on the URL path (the multi-size pipeline). None falls back to the theme placeholder per the artwork-first-or-icon rule."

[[subjects.record_types.track_summary]]
name = "title"
type = "string"
description = "Track title from the playback source's `audio.playback.current` subject."

[[subjects.record_types.track_summary]]
name = "artist"
type = "option<string>"
description = "Track artist when known. None for sources that do not surface artist metadata (radio streams, sample tracks, etc.). Available for richer overlay variants; List view typically hides this field; Tile view may render it on hover or as a second line."

[[subjects.record_types.track_summary]]
name = "album"
type = "option<string>"
description = "Track album when known. Same semantics as `artist`."

# Master-group context record. Set when the entity is a
# member of a master group (subgroup extension; follow-on release). The
# audible-time field is computed per the §4.8
# honest-degradation telemetry; consumers render it
# alongside (or in place of) the configured delay so the
# operator sees what the device actually plays, not what
# the configuration claims it plays.
[[subjects.record_types.master_group_context]]
name = "master_group_id"
type = "string"
description = "Canonical id of the master group this entity is a member of."

[[subjects.record_types.master_group_context]]
name = "master_group_name"
type = "string"
description = "Operator-visible display name of the master group."

[[subjects.record_types.master_group_context]]
name = "delay_ms"
type = "i32"
description = "Operator-configured per-member delay for this entity within the master group (per-member-delay tuning lands in a follow-on release). Negative values indicate the entity plays earlier than the group's reference; positive values indicate later."

[[subjects.record_types.master_group_context]]
name = "audible_time_ms"
type = "i32"
description = "Computed per-member audible-time relative to the master-group reference, honoured per the universal §4.8 honest-degradation contract. Consumers render this alongside the configured delay so the operator sees the actual play offset, not the intended offset."

# State badge enum. Distinguishes between role badges and
# transport-state badges; consumers render the correct
# visual treatment per the universal state-to-visual mapping.
[[subjects.enums.state_badge]]
name = "solo"
description = "Entity is a solo device (not a member of any group)."

[[subjects.enums.state_badge]]
name = "leader_of_group"
description = "Entity is the source-host (leader) of a group. The group's name follows in the operator-visible rendering."

[[subjects.enums.state_badge]]
name = "member_of_group"
description = "Entity is a non-leader member of a group. The group's name + the source-host's display name follow in the operator-visible rendering."

[[subjects.enums.state_badge]]
name = "subgroup_of_master"
description = "Entity is a subgroup within a master group (master-group hierarchy lands in a follow-on release)."

[[subjects.enums.state_badge]]
name = "master_group"
description = "Entity is itself a master group (master-group hierarchy lands in a follow-on release)."

# Transport state enum. Operator-visible per the
# state-to-visual mapping in the public design-doc mirror.
[[subjects.enums.transport_state]]
name = "playing"
description = "Audio is playing on this entity. Cards render live artwork + title."

[[subjects.enums.transport_state]]
name = "paused"
description = "Audio is loaded and paused on this entity. Cards render live artwork + title + a pause overlay."

[[subjects.enums.transport_state]]
name = "stopped"
description = "Audio playback is stopped. Cards render theme placeholder + `Stopped` badge."

[[subjects.enums.transport_state]]
name = "idle"
description = "No source loaded. Cards render theme placeholder + `Idle` badge."

[[subjects.enums.transport_state]]
name = "offline"
description = "Entity has not been observed on the audio-plane recently. Cards render dimmed theme placeholder + `Offline` badge."

[[subjects.enums.transport_state]]
name = "unpaired"
description = "Entity is discovered via mDNS but not yet admitted to the household. Cards render a + overlay + `Unpaired (admit?)` badge; tap dispatches the admission confirmation flow."

[[subjects.enums.transport_state]]
name = "revoked"
description = "Entity was previously admitted and has been operator-revoked. Cards render dimmed theme placeholder + `Revoked` badge; non-interactive until re-admitted."

[[acceptance]]
name = "multiroom-device-card-envelope-unified-across-cases"
detail = "The `MultiroomDeviceCardEnvelope` value shape MUST be identical across solo device, group leader, group member, subgroup, and master-group entities. Discrimination by transport_state + state_badge + master_group_context only; no per-case envelope variants."

[[acceptance]]
name = "multiroom-device-card-reactive-subject-binding"
detail = "Cards MUST be fed via the framework's subject-state subscription substrate: every card subscribes once at mount and receives every subsequent transition reactively until unmount. Polling for refresh is non-conformant."

[[acceptance]]
name = "multiroom-device-card-instance-per-entity"
detail = "Exactly one `audio.multiroom.device_card` instance per device-or-group entity in the household. The publishing admission (source-host for group entities and member-care entities; receiver-role admission for solo / unmanaged entities) is the single authoritative source for each instance."

[[acceptance]]
name = "multiroom-device-card-theme-placeholder-fallback"
detail = "When the operator's active theme contributes no placeholder artwork (theme broken, theme not yet loaded, etc.), the publisher MUST fall back to the framework-default neutral evo glyph. Telemetry records placeholder-fallback events so operators can debug a missing theme."

[[acceptance]]
name = "multiroom-single-source-per-group"
detail = "Cardinality refused at admission if a second source-role multi-room plugin attempts admission for the same group."

[[acceptance]]
name = "multiroom-non-panic-on-pcm-loss"
detail = "Source-role plugin survives capture PCM loss (snd-aloop unloaded, audio backend stopped) without panic. Returns structured error + degrades cleanly. Receiver-role plugin survives playback PCM loss with the same posture."

[[acceptance]]
name = "multiroom-frame-trace-source-only"
detail = "The `audio.multiroom.frame_trace` subject MUST be published only by the source-host of each group. Receivers MUST NOT publish a parallel per-node trace subject; the source-host aggregator is the single point of truth for cross-node alignment."

[[acceptance]]
name = "multiroom-frame-trace-rolling-bound"
detail = "The rolling window MUST be bounded. The subject's serialised footprint stays within the framework's subject-substrate size budget regardless of how long the source-host has been running."

[[acceptance]]
name = "multiroom-frame-trace-clock-offset-from-audio-plane"
detail = "The `clock_offset_ns` field MUST be sourced from the audio-plane's existing NTP-lite clock-sync probe. A multi-room plugin MUST NOT introduce a parallel clock-sync mechanism for trace purposes; the audio-plane sync probe is the single source of truth for cross-node clock alignment."

