# Schema for the `artwork.providers` shelf at shape version 1.
#
# Artwork-provider plugins resolve artwork (album covers,
# station logos, track thumbnails) for media identifiers passed
# by consumer plugins. Plugins implement a single resolve verb;
# the framework admits multiple providers under the shelf and
# may route by priority, capability, or first-match per consumer
# strategy.
#
# Reference plugin: `org.evoframework.artwork.local` in
# evo-device-audio (resolves from MPD library + embedded tags).

schema_version = 1
rack = "artwork"
shelf = "providers"
shape = 1

description = """
Artwork-provider shelf. Plugins resolve artwork for a given
media identifier and return either a URI (for downstream fetch)
or inline blob bytes. Multiple providers admit per shelf; the
caller's resolution strategy decides priority order across the
admitted set.
"""

[[requests]]
request_type = "artwork.resolve"
description = """
Resolve artwork for the supplied media target, optionally at a
specific size variant. Returns a structured response carrying
a stable `content_hash` (when bytes were resolved + cached) and
the source mime / size.

Request payload (v1):

```json
{
  "v": 1,
  "target": { "scheme": "<scheme>", "value": "<external-addressing value>" },
  "size": "tiny" | "medium" | "large" | "original"
}
```

`target.scheme` is caller data, not a value this schema
freezes. It mirrors whatever external-addressing scheme strings
the publisher uses — `mpd-path` for a file URI and `mpd-album`
for the compound `"{artist}|{album}"` shape are the common cases,
not the permitted set. A provider MUST treat an unrecognised
scheme as a miss rather than an error. `target.value` is the
scheme-specific opaque value.

`size` is optional; defaults to `"original"` when absent. The
taxonomy matches the operator-UI's render targets at 2x retina
density:

- `tiny` — 128 px bounding box (sidebar thumbnails)
- `medium` — 300 px bounding box (queue rows / library tiles)
- `large` — 600 px bounding box (now-playing card)
- `original` — no resize (album-art view, multi-room
  propagation, archival)

Response payload (v1):

```json
{
  "v": 1,
  "status": "ok" | "not_found" | "bad_request",
  "path": "<absolute path>" | null,
  "content_hash": "<SHA-256 hex>" | null,
  "mime": "image/jpeg" | "image/png" | "image/webp" | null,
  "size": "tiny" | "medium" | "large" | "original" | null,
  "detail": "<operator-readable detail>" | null
}
```

On `status = "ok"`:
- `content_hash` is the SHA-256 (lowercase 64-hex) of the
  resolved variant's bytes. The hash GET that serves them
  (`/api/v1/audio/artwork/<content_hash>`) is a distribution
  contract, mounted by the distribution that ships artwork; this
  schema names the hash, not the route's owner.
- `mime` is `image/webp` for resized variants (per the
  reference plugin's transcoding posture) or the source MIME
  for `original`.
- `size` round-trips with the request's `size` parameter.
- `path` is retained for in-process callers that prefer the
  cover file path to the cache-hosted bytes.

On `status = "not_found"` / `bad_request`:
- `path` and `content_hash` are null; `detail` carries the
  operator-readable reason.

Reference plugin: `org.evoframework.artwork.local`.
"""

[[acceptance]]
name = "resolve-deterministic-per-input"
detail = "resolve(target, size) returns the same artwork content_hash across calls within the plugin's cache window. Identical (target, size) inputs MUST produce identical content_hash outputs."

[[acceptance]]
name = "resolve-not-found-is-structured"
detail = "When the provider cannot resolve, returns a structured not-found response with status=\"not_found\" + a populated detail field, not an error. Caller composes fallback across providers."

[[acceptance]]
name = "resolve-no-network-unless-declared"
detail = "Plugin must not perform outbound network fetches unless its manifest declares `prerequisites.outbound_network = true` (per BOUNDARY discipline)."

[[acceptance]]
name = "resolve-size-variants-are-distinct"
detail = "Each size variant (tiny / medium / large / original) for the same target MUST produce a distinct content_hash. Multi-room receivers fetching by hash MUST receive exactly the variant the leader produced for that size; a leader rendering medium thumbnails followed by a receiver fetching the same hash MUST get the medium-resized bytes, not the original master."

[[acceptance]]
name = "resolve-populates-asset-cache"
detail = "When status=\"ok\" and the framework wired LoadContext.asset_cache, the plugin MUST push the resolved bytes into the cache under the returned content_hash before responding. The distribution's hash GET (`/api/v1/audio/artwork/<content_hash>`) serves whatever lands here; absent cache writes it returns 404 and consumers fall back per the universal artwork-first-or-icon rule."

[[acceptance]]
name = "resolve-size-unknown-is-bad-request"
detail = "Unknown size values surface as status=\"bad_request\" with a structured detail naming the legal taxonomy. The plugin MUST NOT silently coerce to original — the operator UI sees a recognisable refusal."

[[acceptance]]
name = "resolve-aspect-ratio-preserved-on-resize"
detail = "Resized variants preserve aspect ratio. The size taxonomy is interpreted as a bounding box — the output's longer edge equals the target px, the shorter edge scales proportionally. Forced square crop is forbidden — operator-UI rendering layers (CSS object-fit) handle visual centering."

[[acceptance]]
name = "resolve-no-upscale-on-small-sources"
detail = "Source images smaller than the target bounding box are passed through verbatim — no upscale. Upscaling adds softness without adding information; the operator gets the master fidelity instead."

# ------------------------------------------------------------
# artwork.resolve_online — album-artwork cascade over online
# providers. Distinct from `artwork.resolve` (local plugin) so
# co-occupants of the shelf partition the verb set: local owns
# the local resolve, online owns the online cascade.
# ------------------------------------------------------------

[[requests]]
request_type = "artwork.resolve_online"
description = """
Resolve album artwork from online providers (Cover Art Archive
+ Last.fm + iTunes + Volumio meta proxy). Same
request-payload shape as `artwork.resolve`; the transcode +
asset-cache posture mirrors the local resolver so consumers
use one decoder across both cascade tiers. Adds
`provider_id` on `status = "ok"` naming which upstream
returned the bytes (`cover_art_archive` / `lastfm` / `itunes` /
`volumio_meta`).

Response gains a distinct `status = "unavailable"` value when
the online cascade was reachable-but-transient (rate-limit,
5xx, timeout, transcode fault). Callers MUST NOT cache
`unavailable` as absence — the transient-not-cached invariant.

Reference plugin: `org.evoframework.artwork.online`.
"""

[[requests]]
request_type = "artwork.resolve_artist_artwork"
description = """
Aggregate artist-artwork cascade. Runs enabled artwork
providers in parallel (`volumio_meta` artistArt +
`theaudiodb` artist thumb + `deezer` artist portrait +
`fanart_tv` HD backgrounds / logos / banners) and returns
every source that contributed content-bearing artwork as a
`sources: Vec<SourceEntry>` array, ordered by the operator's
per-provider priority. Top-level `provider_id` /
`privacy_class` / `attribution` mirror `sources[0]`; top-level
`payload` is the field-level first-non-empty merge across
every source (Jellyfin / beets pattern). The operator UI's
per-source selection surface reads `sources` directly.

Request payload (v1):

```json
{
  "v": 1,
  "artist": "<display name>",
  "artist_mbid": "<MusicBrainz artist MBID (optional)>"
}
```

`artist` is required. `artist_mbid` unlocks fanart.tv (which
keys on MBID exclusively); other providers use it as a
disambiguator when present. Without a stored fanart.tv key
the fanart_tv source is skipped silently.

Response payload (v1):

```json
{
  "v": 1,
  "status": "ok" | "not_found" | "not_configured" | "bad_request",
  "provider_id": "<sources[0].provider_id>" | null,
  "privacy_class": "anonymous" | "identity_bearing" | null,
  "payload": <field-level first-non-empty merge across sources> | null,
  "detail": "<operator-readable detail>" | null,
  "attribution": { "source_name": "...", "source_url": "...", "license": "..." } | null,
  "sources": [
    {
      "provider_id": "volumio_meta" | "theaudiodb" | "deezer" | "fanart_tv",
      "privacy_class": "anonymous" | "identity_bearing",
      "payload": <provider-specific fields>,
      "attribution": { "source_name": "...", "source_url": "...", "license": "..." }
    }
  ]
}
```

Deezer-specific invariant: the source's `payload` carries
`cache_policy: "live_fetch_only"`. Deezer's response body
MUST NOT be persisted by any downstream consumer; the URLs
render live from Deezer's CDN. Enforced structurally at the
plugin boundary by `ArtistImageHit`'s deliberate absence of
`Serialize`.

Transient upstream errors (network timeout, 5xx, 429) NEVER
cache and NEVER surface a non-`None` source entry. Silence
is a cascade-level skip; the aggregate uses the entries that
did return.

Reference plugin: `org.evoframework.artwork.online`.
"""

[[acceptance]]
name = "artist-artwork-sources-per-contributor"
detail = "For a query where two or more providers are enabled and available for the artist, `sources` MUST contain a populated entry for EACH provider that returned content — not only the first — each with non-empty payload and correct attribution."

[[acceptance]]
name = "artist-artwork-priority-orders-sources"
detail = "Operator per-source priority determines both which entries appear in `sources` (only enabled providers) and their order (priority ascending, provider_id ascending). Top-level `provider_id` / `attribution` mirror `sources[0]`."

[[acceptance]]
name = "artist-artwork-toggle-live"
detail = "Setting `enabled = false` on a provider via `online_providers_set_enabled` removes that provider's entry from the next query's `sources` without a plugin restart. Re-enable restores the entry on the next query."

[[acceptance]]
name = "artist-artwork-deezer-live-fetch-only"
detail = "The deezer source's payload carries `cache_policy: \"live_fetch_only\"`. Downstream consumers rendering the image URLs MUST NOT persist the resulting bytes — Deezer's ToS restricts image caching. The plugin's `ArtistImageHit` type deliberately omits `Serialize` so persisting the response body is a compile error, not merely a policy."
