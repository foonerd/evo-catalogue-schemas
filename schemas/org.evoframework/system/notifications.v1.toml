# Schema for the `system.notifications` shelf at shape version 1.
#
# Framework-tier operator-visible notifications shelf. Any plugin
# that surfaces a condition to the operator (doorbell ringing,
# alarm firing, plugin admission needing consent, source
# unreachable, retention prune anomaly) emits a Notification by
# dispatching `system.notifications.send` on this shelf. The
# reference plugin stocking the shelf owns the in-memory
# dispatcher: resolves the active mode against the base + quiet-
# hours policy, coalesces by optional group id, assigns a handle,
# and republishes the active list as this shelf's
# `system.notifications.active` subject.
#
# The subject is the UI-team consumption surface: one subscription
# yields the full active list plus every subsequent transition
# (send / cancel / mode-change / auto-dismiss). Operator surfaces
# render banner / tray / DND-toggle / quiet-hours-editor / chime-
# mode-selector widgets against the envelope; consuming code
# never polls.
#
# Reference plugin: `org.evoframework.system.notifications`
# (framework-reserved namespace). Vendor distributions may ship
# a replacement under a vendor namespace for a different back-end
# (desktop-environment integration, mobile push, siren) provided
# it stocks the same five verbs and publishes the same subject
# shape.

schema_version = 1
rack = "system"
shelf = "notifications"
shape = 1

description = """
Framework-tier operator-visible notifications shelf. Plugin
authors emit notifications by dispatching
`system.notifications.send` on this shelf; the reference plugin
resolves the mode, registers the notification, assigns a handle,
and republishes the active list on the shelf's active subject.
Operator surfaces consume the subject to render banner / tray /
DND-toggle / quiet-hours-editor / chime-mode-selector widgets.
"""

# Verbs stocked on the shelf. All five are handled by the
# admitted plugin — the framework routes to it via the plugin
# router. Read/emit/cancel are anonymous; mode + quiet-hours
# are step-up-gated against system_admin at the framework
# dispatcher.

[[requests]]
request_type = "system.notifications.list_active"
description = """
Read the current active-notifications envelope. Returns the same
shape the `system_notifications_active` subject carries:
`{ v: 1, envelope: { active: [active_notification...], base_mode,
quiet_hours_active, quiet_hours_policy, last_update_at } }`.
Read-then-subscribe seed for the tray + banner widgets so a
freshly-connecting UI consumer renders the first frame without
waiting for the next send / cancel. Idempotent; no state change;
framework-runtime-owned.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "system.notifications.set_base_mode"
description = """
Set the operator's base notification mode. `display_only` shows
banners only; `chime` plays the notification's audio payload (or
a resolved default) when quiet hours are not active; `voice`
plays a spoken rendering when supported by the audio backend.
Quiet hours can downgrade the effective mode independently of
the base. Immediate — the dispatcher republishes the active list
with the new resolved modes on return.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "system.notifications.set_quiet_hours"
description = """
Set the operator's quiet-hours policy. The policy carries a
start / end minute-of-day window and a downgrade mode applied
during the window. Republishes the active list with the new
resolved modes on return.
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "system.notifications.send"
description = """
Emit a notification. Any plugin may dispatch this verb; the
payload is a full `Notification` record (level / priority /
source_plugin / title_key / body_key / audio_payload / actions /
group_with / auto_dismiss_after / display_widget). The reference
plugin resolves the active mode against the current base +
quiet-hours policy, coalesces on `group_with` when present,
assigns a handle, and returns `{ handle, resolved_mode }`.
Republishes the active list envelope on the shelf's active
subject. Attribution flows via the payload's `source_plugin`
field; forgery is a plugin-to-plugin trust concern the framework
does not police at admission (a follow-on framework enhancement
may inject caller identity into the request context so the
reference plugin can enforce). Not idempotent — every call adds
a new active entry (or coalesces one onto an existing group).
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

[[requests]]
request_type = "system.notifications.cancel"
description = """
Cancel an active notification by handle. Idempotent — cancelling
an unknown handle returns NotFound without altering state.
Republishes the active list with the entry removed on return.
Used both by operator gestures (banner / tray dismiss) and by
plugins retracting a notification when its underlying condition
clears (e.g. doorbell stops ringing before auto-dismiss fires).
"""
payload_in = "tbd-review"
payload_out = "tbd-review"

# Published subjects — read-able surface for UI consumers.
#
# `system.notifications.active` is a singleton subject (one
# instance per node, addressing value `local`) carrying the full
# active-notifications list plus the current resolved mode.
# UI subscribes once at mount; receives every subsequent
# transition (send / cancel / mode change / auto-dismiss) as a
# fresh envelope. The full-snapshot shape (rather than delta)
# keeps consumers stateless and makes reconnect-during-outage
# semantics trivial: on reconnect the next update carries the
# ground-truth list.

[[subjects]]
name = "system.notifications.active"
description = "Singleton subject carrying every currently-active notification plus the resolved base mode and quiet-hours state. Republished by the framework's NotificationDispatcher on every send / cancel / mode-change / auto-dismiss transition. UI consumers subscribe once and receive full snapshots; polling is non-conformant."

[[subjects.fields]]
name = "active"
type = "array<active_notification>"
description = "Every notification currently in the active registry, ordered newest-first. Empty when no notifications are active. Group-coalesced entries appear as one record with group_count > 1."

[[subjects.fields]]
name = "base_mode"
type = "notification_mode"
description = "Operator-set base mode (`display_only`, `chime`, `voice`). Widgets rendering the DND-toggle / mode-selector read this directly rather than tracking it separately."

[[subjects.fields]]
name = "quiet_hours_active"
type = "boolean"
description = "True when the current wall-clock minute falls inside the operator-configured quiet-hours window. Widgets rendering the quiet-hours indicator use this alongside the underlying policy to show whether the window is currently in effect."

[[subjects.fields]]
name = "quiet_hours_policy"
type = "quiet_hours_policy"
description = "The active quiet-hours policy — start minute, end minute, downgrade mode. Widgets rendering the quiet-hours editor use this to seed the form; when no policy is set the fields are zero and the widget renders the empty-policy state."

[[subjects.fields]]
name = "last_update_at"
type = "system_time"
description = "Wall-clock timestamp of the last envelope refresh. UI renders `<n>s ago` staleness indicators; reactive consumers ignore the field (they receive transitions on the underlying happenings)."

# Per-notification record. The shape mirrors the SDK's
# `Notification` + `ActiveNotification` structs so plugin
# authors and UI consumers share one vocabulary. Fields that
# the SDK reserves as Option render here as optional wire
# fields (absent when None).

[[subjects.record_types.active_notification]]
name = "handle"
type = "u64"
description = "Stable handle minted by the dispatcher at send time. Widgets pass this back to `system.notifications.cancel` when the operator dismisses the entry from the tray."

[[subjects.record_types.active_notification]]
name = "level"
type = "notification_level"
description = "Semantic class (`info`, `warning`, `error`, `alert`). Drives the widget's visual treatment — colour band, icon, urgency indicator."

[[subjects.record_types.active_notification]]
name = "source_plugin"
type = "string"
description = "Canonical id of the plugin that emitted this notification. The framework wrapper enforces this matches the emitting plugin's identity; UI displays it so the operator can attribute the notification to its source."

[[subjects.record_types.active_notification]]
name = "title_key"
type = "string"
description = "Translation key for the short title (e.g., `doorbell.front_door.title`). UI resolves against the framework's translation catalogue; falls back to the key itself when unresolved so the operator still sees something meaningful."

[[subjects.record_types.active_notification]]
name = "body_key"
type = "option<string>"
description = "Translation key for the longer body, when present. UI resolves via the same catalogue as title_key. Widgets rendering the compact banner may hide the body; tray view renders it."

[[subjects.record_types.active_notification]]
name = "audio_payload"
type = "option<audio_payload>"
description = "Audio to play in `chime` / `voice` modes. Absent means audio modes downgrade to a default chime resolved by the audio backend, or to display-only when no default is configured."

[[subjects.record_types.active_notification]]
name = "display_widget"
type = "option<string>"
description = "Optional widget-kind override. Absent means the default `evo.notifications.banner` widget renders. Plugins may suggest richer widgets when one is available (e.g. `evo.notifications.doorbell.tile` with camera preview)."

[[subjects.record_types.active_notification]]
name = "actions"
type = "array<notification_action>"
description = "User actions exposed on the banner (dismiss, snooze, custom verbs). Empty when the notification is informational only. Widgets render one button per action; the operator tapping fires the action's verb through the framework's dispatcher."

[[subjects.record_types.active_notification]]
name = "priority"
type = "notification_priority"
description = "Priority class (`routine`, `important`, `critical`). Ordering hint for the tray: critical entries pin to the top; routine entries scroll below. Also affects auto-dismiss default when the notification carries none."

[[subjects.record_types.active_notification]]
name = "group_with"
type = "option<string>"
description = "Group id when this notification participates in coalescing. Widgets rendering the tray collapse entries sharing a group id into a single visual with the count exposed via group_count."

[[subjects.record_types.active_notification]]
name = "auto_dismiss_after_ms"
type = "option<u64>"
description = "Auto-dismiss timeout in milliseconds. Absent means no auto-dismiss — the notification stays active until an operator dismiss or a plugin cancel. UI renders a fading indicator for time-boxed entries."

[[subjects.record_types.active_notification]]
name = "resolved_mode"
type = "notification_mode"
description = "The mode the dispatcher resolved for this entry at send time. Distinct from the current base_mode when the entry was sent under a prior mode; the audio backend uses this to know whether audio has already rendered."

[[subjects.record_types.active_notification]]
name = "group_count"
type = "u32"
description = "Count of coalesced group members represented by this entry. 1 for standalone entries; > 1 for group-coalesced entries. Widget renders the count as a badge."

[[subjects.record_types.active_notification]]
name = "sent_at"
type = "system_time"
description = "Wall-clock timestamp at which the dispatcher registered this notification. UI renders `<n>s ago` freshness indicators."

# Audio payload record. The SDK's `AudioPayload` enum is
# rendered here as its `kind` discriminator + the per-kind
# fields; consumers switch on `kind` to render the appropriate
# UI (e.g. `chime` renders the chime name; `voice` renders the
# text).

[[subjects.record_types.audio_payload]]
name = "kind"
type = "string"
description = "Payload kind: `chime` (a named preset), `voice` (spoken text), `file` (a resolvable audio URL)."

[[subjects.record_types.audio_payload]]
name = "chime_name"
type = "option<string>"
description = "Set when kind = `chime`. Names a preset chime the audio backend resolves (e.g. `doorbell`, `alarm`)."

[[subjects.record_types.audio_payload]]
name = "voice_text"
type = "option<string>"
description = "Set when kind = `voice`. Spoken text (rendered via the audio backend's TTS route)."

[[subjects.record_types.audio_payload]]
name = "file_url"
type = "option<string>"
description = "Set when kind = `file`. Absolute URL of the audio file to play."

# Notification-action record. Each entry names a verb the
# framework will dispatch when the operator activates the
# action, plus a translation key for the button label.

[[subjects.record_types.notification_action]]
name = "id"
type = "string"
description = "Stable id for this action within its parent notification (e.g. `answer`, `snooze_5m`). Widget uses this to key the button; not operator-visible."

[[subjects.record_types.notification_action]]
name = "label_key"
type = "string"
description = "Translation key for the operator-visible button label (e.g. `notifications.doorbell.answer`)."

[[subjects.record_types.notification_action]]
name = "verb"
type = "string"
description = "Framework verb the button activates. Dispatched with the notification handle as its argument."

# Quiet-hours policy record. Zero start + zero end means no
# window — the policy is inert. When start < end the window
# is contiguous (e.g. 22:00–06:00 crosses midnight, expressed
# as start=1320, end=360 with the wrap-around implicit in the
# framework's minute-of-day comparison).

[[subjects.record_types.quiet_hours_policy]]
name = "start_minute"
type = "u16"
description = "Window start as minutes since midnight (0..1439). Zero when the policy is unset."

[[subjects.record_types.quiet_hours_policy]]
name = "end_minute"
type = "u16"
description = "Window end as minutes since midnight (0..1439). Zero when the policy is unset. When end < start the window wraps midnight."

[[subjects.record_types.quiet_hours_policy]]
name = "downgrade_mode"
type = "notification_mode"
description = "Mode active notifications downgrade to during the window (typically `display_only`)."

# Enums shared across the shelf.

[[subjects.enums.notification_mode]]
name = "display_only"
description = "Banners render visually; no audio. The operator-quiet default and the typical quiet-hours downgrade target."

[[subjects.enums.notification_mode]]
name = "chime"
description = "Banners render visually; the notification's audio payload plays (or a default chime resolves) when the audio backend is configured."

[[subjects.enums.notification_mode]]
name = "voice"
description = "Banners render visually; voice payloads render as spoken text via the audio backend's TTS route. Non-voice payloads fall back to the chime treatment."

[[subjects.enums.notification_level]]
name = "info"
description = "Informational — no action required. Widgets render with a neutral colour band."

[[subjects.enums.notification_level]]
name = "warning"
description = "Warning — the operator may want to review. Widgets render with a warning colour band."

[[subjects.enums.notification_level]]
name = "error"
description = "Error — a recoverable condition worth operator attention. Widgets render with an error colour band."

[[subjects.enums.notification_level]]
name = "alert"
description = "Alert — a condition demanding immediate attention (fire, intrusion, critical fault). Widgets pin to the top and pulse."

[[subjects.enums.notification_priority]]
name = "routine"
description = "Routine — auto-dismiss defaults to 8 seconds when the entry declares none."

[[subjects.enums.notification_priority]]
name = "important"
description = "Important — auto-dismiss defaults to 30 seconds when the entry declares none. Widgets sort above routine."

[[subjects.enums.notification_priority]]
name = "critical"
description = "Critical — never auto-dismisses. Widgets pin to the top of the tray and remain until explicit dismiss or plugin cancel."

# Widget-kind suggestions. These are advisory — vendor
# distributions may implement additional widget kinds (e.g.
# hardware-button LED sync, per-plugin themed overlays) or
# elide some. The framework's reference UI implements every
# suggestion below.

[[widget_kinds]]
name = "evo.notifications.banner"
description = "Single-notification card rendered as an overlay. Consumes one `active_notification` record. Renders title, body (optional), source plugin, priority indicator, action buttons. Auto-dismisses when auto_dismiss_after_ms elapses."

[[widget_kinds]]
name = "evo.notifications.tray"
description = "Stacked list of every active notification, ordered by (priority desc, sent_at desc). Consumes the full `active` array. Group-coalesced entries render as one row with the group_count badge. Empty state renders `No active notifications`."

[[widget_kinds]]
name = "evo.notifications.dnd_toggle"
description = "Compact toggle mapping the base mode to a boolean surface (`display_only` = on, `chime` / `voice` = off). Dispatches `system.notifications.set_base_mode` on activation. Widget renders a segmented control for the three-way choice too."

[[widget_kinds]]
name = "evo.notifications.mode_selector"
description = "Three-way segmented control for the base mode (`display_only`, `chime`, `voice`). Dispatches `system.notifications.set_base_mode` on selection change. Reads `base_mode` from the subject; renders the current selection reactively."

[[widget_kinds]]
name = "evo.notifications.quiet_hours_editor"
description = "Two time-of-day pickers (start, end) plus a downgrade-mode selector. Dispatches `system.notifications.set_quiet_hours` on save. Reads `quiet_hours_policy` from the subject to seed the form. Renders the empty-policy state when start = end = 0."

[[widget_kinds]]
name = "evo.notifications.quiet_hours_indicator"
description = "Compact indicator surfacing whether the current wall-clock minute falls inside the quiet-hours window. Reads `quiet_hours_active`. Widgets rendering the tray header include this so the operator sees why chimes are muted."

[[widget_kinds]]
name = "evo.notifications.group_collapse"
description = "Collapsible list variant for grouped notifications. Consumes entries whose group_with matches. Renders the group's summary row with the count badge; expands to show every coalesced member."

# Acceptance criteria a runtime implementation MUST meet.
# The framework does not enforce these at admission (no runtime
# assertion harness yet); they document what a future shape-
# conformance test would check.

[[acceptance]]
name = "singleton-per-node"
detail = "Exactly one `system.notifications.active` instance per node, addressing value `local`. The framework's NotificationDispatcher is the single authoritative publisher. Consumers subscribe to the fixed addressing and receive updates without needing to learn their own node id."

[[acceptance]]
name = "republish-on-every-transition"
detail = "The subject MUST be republished on every send / cancel / auto-dismiss / set_base_mode / set_quiet_hours event. Consumers connecting between transitions MUST see the current active list immediately, not an empty payload. Any transition that changes the resolved_mode of any entry (e.g. quiet-hours window opening) MUST republish."

[[acceptance]]
name = "full-snapshot-envelope"
detail = "Every envelope carries the full active list, base_mode, quiet_hours_active, quiet_hours_policy — not a delta. Reconnect-during-outage semantics MUST work without a delta-replay protocol; the next envelope after reconnect carries ground truth."

[[acceptance]]
name = "auto-dismiss-fires-republish"
detail = "When an entry's auto_dismiss timer fires, the framework MUST remove the entry from the active list AND republish the subject in the same atomic step. Consumers observing the removal MUST see the new list, not the pre-remove list plus a separate remove event."

[[acceptance]]
name = "handle-stability-across-republishes"
detail = "An entry's `handle` MUST remain stable across every republish for the lifetime of the entry. Consumers tracking entry identity (e.g. animated banner slots) rely on the handle as the entry key; a handle that changes mid-lifetime forces re-render."

[[acceptance]]
name = "group-coalesce-preserves-first-handle"
detail = "When a new notification coalesces into an existing group entry, the group's handle MUST be the first entry's handle (not the newest). Consumers rendering the group card use the handle as its identity; a handle that shifts to the newest entry forces re-render on every group member arrival."

[[acceptance]]
name = "source-plugin-attribution-payload-driven"
detail = "The `source_plugin` field on the emit payload MUST be the plugin's canonical name. The reference plugin records whatever value the payload carries and surfaces it on the tray. Framework-level attribution enforcement (rejecting mismatched payloads at dispatch time) is not currently in scope; it becomes possible once the request context carries a framework-populated caller-identity field."

[[acceptance]]
name = "cancel-verb-idempotent"
detail = "The `system.notifications.cancel` verb MUST return NotFound (not error) for unknown handles. Idempotence lets operator surfaces resend on unreliable transports without failure cascades."

[[acceptance]]
name = "quiet-hours-window-crosses-midnight"
detail = "A policy with start > end MUST activate for minutes >= start OR minutes < end (the window wraps midnight). A policy with start = end MUST be inert (no downgrade). Consumers rendering the quiet-hours indicator use `quiet_hours_active` from the subject rather than recomputing this arithmetic locally."
