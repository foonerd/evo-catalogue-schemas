# Schema for the `audio.library` shelf at shape version 1.
#
# Library shelves host the operator-facing music library
# surface: source registry (the set of registered library
# roots and their per-source reachability state), browse,
# search, and scan orchestration. The source registry is the
# load-bearing primitive for the device's mixed-source
# resilience contract — every library root is a typed,
# reachability-aware source with its own state machine,
# scan policy, and configuration shape.
#
# Reference plugin: `org.evoframework.playback.mpd` in
# evo-device-audio. The plugin owns this shelf alongside
# audio.playback, audio.queue, audio.playlist, audio.favourites.
#
# Source-state awareness. Each source's reachability state
# (Probing / Online / Degraded / Offline / Retired) is
# observable as part of `audio_library_sources` subject's
# state. The plugin's per-source supervisor probes each
# source at its type-specific cadence and transitions the
# state machine; the sticker reconciler marks every song
# under an Offline source as `evo:available=0` so consumers
# (queue, playlist, favourites, browse, search) surface the
# per-song available flag honestly.
#
# Lazy-scan for cloud. Cloud sources default to
# LazyBrowseDriven scan policy — `browse_library` walks the
# cloud's directory tree one level on operator demand;
# eager batch scan is opt-in only. The lazy default refuses
# Volumio's "rescan everything" pattern that hours-eats
# operator state and trips cloud rate limits.

schema_version = 1
rack = "audio"
shelf = "library"
shape = 1

description = """
Source-state-aware music library surface. Operator manages
the set of registered library sources (local-internal,
local-USB, NAS over SMB / NFS, cloud Google Drive / OneDrive,
future DLNA); each source is a typed record with a
reachability state machine, type-specific scan policy, and
operator-visible last-seen-online + scan-progress fields.
Browse, search, update, rescan orchestration goes through
this shelf. Cloud sources default to lazy-browse-driven
scan; eager batch scan is opt-in per source.

Cross-shelf contract. The plugin's per-source supervisor +
sticker reconciler maintain the `evo:available` per-song
sticker that audio.queue / audio.playlist / audio.favourites
project as their per-item `available` flag. The library
shelf is the single source of truth for source state and
per-song availability; consumer shelves MUST derive their
available flags from the sticker (see audio.queue.v1
acceptance row `queue-item-available-flag-derives-from-sticker`).
"""

# ----- Source-registration verbs -----

[[requests]]
request_type = "library.list_sources"
description = """
Read the full source registry. Returns
`{ v: 1, sources: [SourceRecord...], total: u32 }` where each
SourceRecord is:

```
{
  "id":                       string,           // uuid
  "display_name":             string,
  "kind":                     SourceKind,       // tagged enum below
  "mount_path":               string,           // filesystem path
  "mpd_storage_name":         string | null,    // MPD mount alias
  "state":                    SourceState,      // tagged enum
  "last_seen_online_at_ms":   u64 | null,
  "probe_cadence_ms":         u32,
  "scan_policy":              ScanPolicy,
  "track_count":              u32,
  "track_count_available":    u32,
  "last_scan_at_ms":          u64 | null
}
```

SourceKind tagged-kind enum:

```
{ "kind": "local_internal" }
{ "kind": "local_usb", "device_node": string, "label": string }
{ "kind": "network_nas_smb", "server": string, "share": string, "username": string }
{ "kind": "network_nas_nfs", "server": string, "export": string }
{ "kind": "cloud_gdrive",   "account_ref": string }
{ "kind": "cloud_onedrive", "account_ref": string }
{ "kind": "network_dlna",   "service_id": string }
```

SourceState tagged-kind enum:

```
{ "kind": "probing" }
{ "kind": "online" }
{ "kind": "degraded", "reason": string, "since_ms": u64 }
{ "kind": "offline",  "reason": string, "since_ms": u64 }
{ "kind": "retired" }
```

ScanPolicy tagged-kind enum:

```
{ "kind": "eager_incremental",  "on_online": bool, "on_mount_event": bool }
{ "kind": "lazy_browse_driven", "prefetch_recent": u32 }
{ "kind": "browse_only" }
```

Idempotent + cheap. Consumers use the read-then-subscribe
pattern against the `audio_library_sources` subject.
"""

[[requests]]
request_type = "library.add_source"
description = """
Register a new library source. Payload is
`{ v: 1, display_name: string, kind: SourceKind,
   mount_path: string, scan_policy: ScanPolicy | null,
   probe_cadence_ms: u32 | null,
   cloud_eager_scan_acknowledged: bool | null }`.

`scan_policy` and `probe_cadence_ms` default to type-specific
values when null (local_internal: eager_incremental + 60s;
local_usb: eager_incremental + 5s; network_nas: eager_incremental
+ 30s; cloud: lazy_browse_driven + 300s; dlna: browse_only + 60s).

`cloud_eager_scan_acknowledged` is required when registering a
cloud source with `eager_incremental` scan policy; the operator-
confirmed acknowledgement gates against accidental opt-in to
the eager-scan-on-cloud anti-pattern (rate-limit trips, hours-
long initial scan). Refusal carries the offending policy +
the missing acknowledgement field.

Returns `{ v: 1, source_id: string }`. The plugin spawns the
source's supervisor immediately; the first probe runs within
one probe cadence; `audio_library_sources` subject updates as
the state machine transitions Probing → (Online | Offline).
"""

[[requests]]
request_type = "library.remove_source"
description = """
Deregister a library source. Payload is
`{ v: 1, source_id: string, scrub_mpd_entries: bool }`.

When `scrub_mpd_entries: true` the plugin runs MPD `update`
against the source's mount path AFTER unmounting, scrubbing
the songs from MPD's database. When false, MPD entries persist
(survive remount as a same-named source) but the source's
state machine transitions Retired and its songs are marked
`evo:available=0` permanently for that source-id.

Refusal on unknown source_id is a structured Permanent error.
Refusal on attempt to remove the local-internal source (the
device's always-present floor library) is structured (the
local-internal source is registered automatically at plugin
load and is not removable via this verb).
"""

[[requests]]
request_type = "library.probe_source"
description = """
Trigger an immediate reachability probe on a source. Payload
is `{ v: 1, source_id: string }`. Returns
`{ v: 1, source_id: string, state: SourceState,
   probed_at_ms: u64, probe_duration_ms: u32 }`.

Synchronous: the verb returns after the probe completes (or
times out per the probe's type-specific budget). Idempotent;
the result reflects the just-probed state. Operator UI uses
this verb for "test connection" gestures; the `audio_library_sources`
subject's update fires for any state transition.
"""

[[requests]]
request_type = "library.wake_source"
description = """
Attempt to bring an offline source back online. Payload is
`{ v: 1, source_id: string }`. The wake handler is source-
type-specific:

- `local_internal` / `local_usb`: equivalent to `probe_source`
  (no remount logic; mount is OS-managed).
- `network_nas_smb` / `network_nas_nfs`: attempts a remount
  using the source's stored config; falls through to probe.
- `cloud_gdrive` / `cloud_onedrive`: triggers an auth-token
  refresh attempt (via the operator-configured account
  primitive); falls through to probe.

Returns `{ v: 1, source_id: string, woke: bool, state: SourceState }`.
`woke: true` indicates the wake handler ran a non-trivial
recovery step (remount succeeded, token refreshed); `woke: false`
indicates the handler was a passive probe. The `state` field
reflects the post-handler state.
"""

[[requests]]
request_type = "library.update_source"
description = """
Trigger an incremental MPD update against a source's mount
path. Payload is `{ v: 1, source_id: string, force_rescan: bool }`.

When `force_rescan: true` the plugin issues MPD `rescan`
(re-reads every file's metadata regardless of mtime); when
false, MPD `update` (incremental, mtime-driven). Refusal on
source whose state is `offline` is structured (`source_offline`
error kind; recovery hint: `wake_source`); the operator must
wake the source first.

Returns `{ v: 1, source_id: string, scan_started: bool }`.
Scan progress is published on the `audio_library_scan_progress`
subject; `audio_library_state` subject's `active_scans` list
reflects the in-flight set.
"""

[[requests]]
request_type = "library.browse_library"
description = """
Browse a source's directory tree one level. Payload is
`{ v: 1, source_id: string, path: string | null }`. `path`
null reads the source's root.

Returns `{ v: 1, source_id: string, path: string, entries:
[BrowseEntry...], stale: bool, source_state: SourceState }`.

Each entry is one of:

```
{ "kind": "directory", "name": string, "uri": string }
{ "kind": "file", "name": string, "uri": string,
  "title": string | null, "artist": string | null,
  "album": string | null, "duration_ms": u64 | null,
  "available": bool,
  "artwork_url": string,
  "composer": string | null, "composer_sort": string | null,
  "conductor": string | null, "ensemble": string | null,
  "performer": string | null, "work": string | null,
  "work_sort": string | null, "movement": string | null,
  "movement_number": u32 | null,
  "original_date": string | null, "recording_date": string | null,
  "label": string | null, "medium": string | null }
{ "kind": "playlist", "name": string, "uri": string }
```

`stale: true` indicates the browse-tree cache served the
listing (source is offline; the cached snapshot is what's
returned). `stale: false` indicates a live read against the
source.

Cloud sources execute the browse via the cloud's native list
API (Google Drive `files.list?q=parent`, OneDrive
`/children`) — this is the lazy-scan primitive that walks
the cloud tree on demand instead of eager-batch-scanning.
"""

[[requests]]
request_type = "library.search_library"
description = """
Search across registered sources. Payload is
`{ v: 1, query: string, source_ids: [string...] | null,
   include_offline: bool, max_results: u32 }`.

`source_ids` null means search every Online source;
explicit list filters to that subset. `include_offline: false`
(default) skips Offline sources silently; `true` includes
them and serves results from the browse-tree cache when
available + the cached listing is non-empty (stale results
are flagged per-entry).

`max_results` is capped at 1000 by the framework; values
above 1000 are clamped silently.

Returns `{ v: 1, results: [SearchResult...], truncated: bool,
            stale_sources: [string...] }`. Each SearchResult
mirrors BrowseEntry with the `kind` discriminant + an additional
`source_id: string` field.

Cloud sources execute the search via the cloud's native
search API (Google Drive `q=name contains 'X'`, OneDrive
`$search=X`); local sources delegate to MPD's `search`
command; NAS sources also via MPD's search against the
mounted path.
"""

[[requests]]
request_type = "library.list_works"
description = """
List every Work (musical composition) the library carries,
grouped by MPD's `Work` tag. Payload is
`{ v: 1, source_id: string | null, composer: string | null,
   sort: string | null }`.

`source_id` filters works to those whose contributing tracks
resolve under that source; null matches every source.
`composer` is a case-insensitive substring filter on the work's
composer name; null matches every composer. `sort` is one of
`"composer"` (default — composer then name ascending),
`"name"` (work name ascending), or `"recording_count"`
(recording count descending, ties broken by composer + name).

Returns `{ v: 1, works: [WorkSummary...], total: u32 }`
where each WorkSummary is `{ work_id: string, name: string,
composer: string | null, recording_count: u32,
sources: [string...] }`.

`work_id` is a stable 16-hex-character identifier — the first
16 hex chars of `SHA-256(normalised(composer) + 0x1F +
normalised(work))` where `normalise(s)` lowercases and
collapses whitespace runs. The unit separator (0x1F) between
components prevents `"Bach" + "Cello"` from colliding with
`"" + "BachCello"`. The identifier is deterministic across
plugin restarts and device reboots so the operator-UI can
cache work_id → display state without invalidation on every
reboot.

Grouping rule — conservative: tracks contribute to a Work
entry ONLY when MPD's `Work` tag is populated. NO synthesis
from `Composer + Title` when `Work` is absent. The
acceptance row `library-works-grouped-only-by-explicit-mpd-work-tag`
pins this; UI ships the matching rule.

`recording_count` is the number of distinct
`(album, conductor, original_date)` tuples among the
contributing tracks. Same Work tag + same album + same
conductor + same original_date = one recording; varying any
of those three produces a distinct recording.

Pre-scan cache state: the verb returns an empty `works` list
+ `total: 0` until the first `Database` / `Update` idle
event has populated the works aggregate. The operator-UI
gates the Works shelf on the library_state
`distinct_works` counter being `Some(_)` rather than on the
verb response — the counter being `null` is the "scan not
yet run" signal.
"""

[[requests]]
request_type = "library.get_work_recordings"
description = """
List the distinct recordings of one Work. Payload is
`{ v: 1, work_id: string, source_id: string | null }`.

`source_id` filters to recordings whose work appears under
that source; null matches every source.

Returns `{ v: 1, work_id: string, name: string,
composer: string | null, recordings: [WorkRecording...] }`
where each WorkRecording is `{ recording_id: string,
conductor: string | null, ensemble: string | null,
performer: string | null, original_date: string | null,
recording_date: string | null, label: string | null,
medium: string | null, album_uri: string,
track_uris: [string...], total_duration_ms: u64 | null }`.

`recording_id` is a stable 16-hex-character identifier —
the first 16 hex chars of `SHA-256(normalised(album) +
0x1F + normalised(conductor) + 0x1F +
normalised(original_date))`. Null components (chamber music
recordings without conductors, releases without original
date) collapse to empty strings so the recordings still
produce stable IDs.

`album_uri` is the parent directory of the contributing
tracks, used by UI to navigate to the album view.
`track_uris` is the ordered list of MPD-relative track URIs
comprising the recording (movements), ordered as MPD's
`listallinfo` traversal returns them. `total_duration_ms`
sums the contributing tracks' durations; `null` when no
contributing track reported a duration.

Refusal contract: when the works aggregate cache has not yet
been computed (fresh plugin load, first MPD scan still in
flight), the verb returns a structured Transient error
(`work_aggregate_not_ready`); operator retries succeed after
the next `Database` / `Update` idle event. When `work_id`
does not match any work in the current aggregate, the verb
returns a structured Permanent error (`unknown_work_id`).
"""

[[requests]]
request_type = "library.get_triage"
description = """
Read-only snapshot of the plugin's most recent library-triage
sweep. Payload is the empty object `{}`.

Returns the current `audio_library_triage` envelope
(`{ v: 1, findings: [TriageFinding...], auto_reconciled_count:
u32, prompt_required_count: u32, last_run_at_ms: u64 }`) as of
the sweep that populated the shared subject mirror. No MPD
round-trip; the read is cheap enough for a UI panel-open to
call without special treatment.

Each `TriageFinding` is `{ class: string, severity: string,
description: string, auto_reconciled: bool,
reconciled_at_ms: u64 | null, evidence: object }`. The `class`
is a stable snake-case key naming one drift class the plugin
detects (`mpd_db_empty_but_music_present`,
`registry_count_diverges`, `curation_carries_gone_uris` in the
initial set); UIs key on it for localised copy. `severity` is
one of `info | warn | critical`. `auto_reconciled` is `true`
when the sweep fired the class's safe reconcile action
successfully; `reconciled_at_ms` carries the wall-clock ms of
that completion when `auto_reconciled` is `true`, otherwise
`null`. `evidence` is a class-specific structured blob used for
the diagnostics / audit surface.

`last_run_at_ms` is the wall-clock ms of the last sweep. Zero
before any sweep has run.
"""

[[requests]]
request_type = "library.reconcile_triage"
description = """
Re-run the plugin's library-triage sweep, fire every safe
reconcile action the sweep classifies, and republish the
`audio_library_triage` subject. Payload is the empty object
`{}`.

Returns the resulting envelope in the same shape as
`library.get_triage`. Distinct from that verb in that this
verb performs the sweep (MPD `listallinfo` + `stats`
round-trips, plus each class's reconcile action) before
returning; the returned envelope reflects the post-sweep
state, not the pre-sweep cache.

Concurrency: a process-wide gate serialises concurrent sweep
passes. When a sweep is already in flight, this verb returns
the current pre-sweep cache unchanged rather than queuing.
Operators calling this verb during a warm-start or an idle
`Database` / `Update` burst will see the sweep-in-flight envelope;
the next call after the concurrent sweep completes returns the
fresh state.
"""

# ----- Acceptance rows -----

[[acceptance]]
name = "library-respondent-cardinality"
detail = "Only one plugin may claim this shelf at a time. Co-owned with audio.playback / audio.queue / audio.playlist / audio.favourites by org.evoframework.playback.mpd in the reference distribution."

[[acceptance]]
name = "source-offline-never-triggers-update"
detail = "The per-source supervisor's Offline transition handler MUST NOT call MPD `update PATH` or MPD `rescan PATH`. Update against an unreachable mount produces spurious 'song removed' entries and corrupts operator-curated state. The transition handler runs ONLY the sticker reconciler (`evo:available=0` on every song under the source's mount path). This invariant is the structural protection against the Volumio wipe-on-remount anti-pattern."

[[acceptance]]
name = "sticker-is-availability-source-of-truth"
detail = "The `evo:available` per-song MPD sticker is the single source of truth for per-song availability. Consumer shelves (audio.queue, audio.playlist, audio.favourites, browse / search results) project the sticker as their per-item `available` flag. The plugin MUST NOT maintain a parallel availability store; future contributors introducing a sidecar consistency model violate the invariant."

[[acceptance]]
name = "cloud-default-scan-policy-is-lazy"
detail = "Cloud sources (`cloud_gdrive`, `cloud_onedrive`, future cloud variants) default to `ScanPolicy::LazyBrowseDriven { prefetch_recent: 0 }`. Registering a cloud source with `ScanPolicy::EagerIncremental` requires the operator-confirmed `cloud_eager_scan_acknowledged: true` field on the add_source request; refusal is structured. The lazy default refuses the eager-scan-on-cloud anti-pattern (rate-limit trips, hours-long scans, externally-mutating libraries)."

[[acceptance]]
name = "source-supervisor-per-source-isolation"
detail = "Each source's reachability probe + state machine + scan trigger runs on its own supervisor task. A slow / hung probe on one source MUST NOT block probes on others. A failing probe MUST NOT crash the plugin; failures transition the source's state to Offline + log structured cause + persist the last-seen-online timestamp."

[[acceptance]]
name = "library-state-subject-published-on-load-and-every-source-transition"
detail = "The plugin announces the `audio_library_sources` + `audio_library_state` subjects on load. `audio_library_sources` updates on every source state-machine transition + on every operator add_source / remove_source. `audio_library_state` updates on every scan-state change (scan started, scan completed) + on every batched track-count change. The subjects are the single source of truth; out-of-band sidecar channels are forbidden."

[[acceptance]]
name = "scan-progress-subject-only-during-active-scans"
detail = "The `audio_library_scan_progress` subject is announced on load with empty state `{ v: 1, scans: [] }`. During active scans (MPD `updating_db` field non-zero, or per-source supervisor-driven scan in-flight) the subject's state carries the per-source scan progress; on scan completion the entry is removed and the subject updates. UI consumers read the subject for the live progress; the subject is bounded by the active-scan count which is small (typically 1-2)."

[[acceptance]]
name = "scan-progress-watcher-emits-throttled-scanning-then-explicit-terminal-frame"
detail = "Every `library.update_source` verb dispatch that MPD accepts (scan_started = true) MUST cause the plugin to publish at least one initial `phase = \"scanning\"` frame on `audio_library_scan_progress` within one poll cadence (~500 ms) and exactly one terminal `phase = \"complete\"` frame carrying the final counts when MPD's `status.updating_db` returns to `None`. Silence after a scan trigger, with no terminal frame, is a substrate defect — the operator UI must be able to distinguish a stalled scan from a legitimately quiet one. Emission is throttled by a floor cadence (~500 ms per frame) so a fast rescan cannot flood the happenings bus. A process-wide gate in the plugin serialises watcher spawns; concurrent `update_source` gestures fan out one watcher covering the full scan trajectory, not two. On terminal-frame publish the plugin MUST also republish `audio_library_sources` and `audio_library_state` so the settled counts land on the UI without an operator reload; after a brief settle window (~2 s) the empty envelope `{ scans: [] }` republishes so the resting subject state matches the documented idle shape."

[[acceptance]]
name = "local-internal-source-is-non-removable"
detail = "The plugin registers the local-internal source automatically at plugin load (using the operator-configured `music_directory` from /etc/mpd.conf as the mount path; default `/var/lib/evo/music/INTERNAL`). `library.remove_source` refuses on the local-internal source's id with a structured Permanent error. The local-internal source is the device's floor library; making it removable would create an empty-library state with no recovery path."

[[acceptance]]
name = "browse-library-returns-stale-cache-when-source-offline"
detail = "`browse_library` against an Offline source returns the last cached browse-tree listing (when one exists) with `stale: true` + `source_state: { kind: 'offline', ... }`. Refusal on Offline source is forbidden — the UI's browse view stays operable for offline sources (operator can still see what's in their NAS even when the NAS is down) with the staleness flag carrying the freshness contract. Sources with no cached listing return empty entries + `stale: true`."

[[acceptance]]
name = "library-works-grouped-only-by-explicit-mpd-work-tag"
detail = "`library.list_works` and `library.get_work_recordings` MUST group tracks into Work entries ONLY when MPD's explicit `Work` tag is populated. Synthesis from `Composer + Title` (e.g. stripping movement markers from a title to infer a Work) is forbidden — fabricating a Work where the operator has not tagged one would invent operator-meaningful state. Tracks without an MPD `Work` tag MUST NOT appear in any WorkSummary. The conservative path keeps the wire deterministic against minor MPD tag editing and lets the operator decide when a track participates in the Works shelf by setting the Work tag explicitly. The contributing tracks' MPD `Composer` tag becomes the WorkSummary's `composer` field; `composer` is `null` when the contributing tracks have no Composer tag (rare but possible — an operator may tag Work without Composer)."

[[acceptance]]
name = "library-works-identifiers-stable-across-restarts"
detail = "`work_id` and `recording_id` MUST be deterministic across plugin restarts and device reboots. The reference implementation computes both via SHA-256 truncated to 16 hex chars over a normalised (lowercased + whitespace-collapsed) input with ASCII Unit Separator (0x1F) between components. `work_id` derives from `(composer, work)`; `recording_id` derives from `(album, conductor, original_date)`. None components in the recording identifier collapse to empty strings so chamber-music recordings without conductors still produce stable IDs. The 16-hex-char truncation provides 64 bits of entropy — collision-resistant within any personal music library. Operator-UI MAY cache `work_id` → display state without invalidation on every reboot; the cache stays valid as long as MPD's Composer + Work tags do not change on the contributing tracks."

[[acceptance]]
name = "library-state-classical-counters-are-truth-or-null"
detail = "The three classical counters on `audio_library_state` (`total_tracks_with_composer`, `distinct_works`, `works_with_multiple_recordings`) MUST serialise as JSON `null` when the works aggregate scan has not yet completed (fresh plugin load, first MPD scan still in flight). When the scan has completed, each counter MUST carry the actual count as `Some(u32)`, which is 0 when the library has no classical content. The `0` and `null` semantics are distinct: `null` means `not yet known`; `0` means `known to be zero`. The operator-UI's Auto/On/Off resolution for the Works shelf gates on `works_with_multiple_recordings > 0` (Some-and-positive); the `null` state surfaces a `Scanning library...` indicator rather than `No classical content`. Per the wire-shape-defaults-must-be-truth-or-null invariant (PLUGIN_CONTRACT.md §15)."

[[acceptance]]
name = "library-browse-file-classical-metadata-fields-are-truth-or-null"
detail = "Every BrowseEntry of kind `file` MUST project the 13 classical-music metadata fields (composer, composer_sort, conductor, ensemble, performer, work, work_sort, movement, movement_number, original_date, recording_date, label, medium) from the song's MPD tag set. Each field MUST serialise as JSON `null` when MPD's corresponding tag is absent or empty; empty strings or fabricated zeros are forbidden per the wire-shape-defaults-must-be-truth-or-null invariant (PLUGIN_CONTRACT.md §15). Directory and playlist BrowseEntry kinds do NOT carry classical metadata (they reference container objects, not tracks). The fields are populated by the same `MpdConnection`-level classical-tag parser the queue / favourites / playlist / now_playing surfaces consume so the projection cannot drift between shelves."

[[acceptance]]
name = "library-browse-file-carries-artwork-url"
detail = "Every BrowseEntry of kind `file` MUST carry an `artwork_url` field of shape `/api/v1/audio/artwork?scheme=mpd-path&value=<url-encoded uri>`. Directory and playlist BrowseEntry kinds do NOT carry artwork_url (the operator UI's directory / playlist tiles render via different artwork-resolution surfaces — directory artwork resolves to the first track's cover; playlist tiles render generic icons). The URL is target-addressed; UI consumers append `&size=...` per their render target. Percent-encoding follows RFC 3986 unreserved-set rules. See `audio.playback.v1` acceptance row `now-playing-track-carries-artwork-url` for the full cascade contract."

[[acceptance]]
name = "library-triage-subject-published-on-load-and-every-sweep"
detail = "The plugin announces the `audio_library_triage` subject on load with an empty envelope (`v: 1, findings: [], auto_reconciled_count: 0, prompt_required_count: 0, last_run_at_ms: 0`). Every warm-start rehydrate and every idle `Database` / `Update` burst runs the drift-classifier sweep and republishes the subject with the current findings list, auto-reconcile counts, and last-run timestamp. The operator-triggered `library.reconcile_triage` verb also runs the sweep and republishes. Wave-1 drift classes are `mpd_db_empty_but_music_present`, `registry_count_diverges`, and `curation_carries_gone_uris`; all three are safe-auto-reconcile (no operator gesture required). New drift classes land as new classifier arms + one row in the plugin's living inventory (`LIBRARY-TRIAGE.md`) + one row in this schema; classifier arms without matching schema rows are defects."

[[subjects]]
addressing = { scheme = "evo.audio.library", value = "sources" }
subject_type = "audio_library_sources"
description = """
Live per-source registry state. Updates on every source
state-machine transition (Probing → Online, Online → Offline,
Online → Degraded, etc.) + on every operator add_source /
remove_source.

Payload shape (v1):

```
{
  "v":       1,
  "sources": [SourceRecord...],
  "total":   u32
}
```

SourceRecord shape mirrors the `list_sources` return value.
See the verb section for the full SourceKind / SourceState /
ScanPolicy tagged-kind enum shapes.

First-render state. Consumers use `library.list_sources` once
on connect for the initial frame, subscribe to this subject
for deltas.
"""

[[subjects]]
addressing = { scheme = "evo.audio.library", value = "state" }
subject_type = "audio_library_state"
description = """
Global library aggregate state. Updates on every scan-state
change (scan started, scan completed) + on every batched
track-count change.

Payload shape (v1):

```
{
  "v":                              1,
  "total_tracks":                   u32,
  "total_tracks_available":         u32,
  "last_full_scan_at_ms":           u64 | null,
  "active_scans":                   [string...],  // source_ids with in-flight scans
  "total_tracks_with_composer":     u32 | null,
  "distinct_works":                 u32 | null,
  "works_with_multiple_recordings": u32 | null
}
```

The three classical counters (`total_tracks_with_composer`,
`distinct_works`, `works_with_multiple_recordings`) carry the
truth-or-null cascade — `null` means the works aggregate scan
has not yet completed (fresh plugin load, first MPD scan still
in flight); `Some(value)` is the actual count, which is 0 when
the library has no classical content. The operator-UI gates the
Works shelf and the enriched-metadata strip on these counters
being `Some(_)` so the Auto resolution sees "scan not run yet"
distinctly from "no classical content". The
`works_with_multiple_recordings > 0` predicate is the
operator-meaningful classical-library indicator that drives the
Auto/On/Off resolution for the Works shelf.

Consumers (operator UI's library overview panel) read this
once on connect via a future `library.get_state` read verb
(out of v1 scope; v1 consumers fetch via list_sources +
client-side aggregate) and subscribe for live updates.
"""

[[subjects]]
addressing = { scheme = "evo.audio.library", value = "scan_progress" }
subject_type = "audio_library_scan_progress"
description = """
Live per-source scan progress. Announced with the empty
envelope (`{ v: 1, scans: [] }`) at plugin load; republished
on every scan trigger — the `library.update_source` verb
spawns a per-scan watcher that polls MPD `status.updating_db`
at a throttled cadence (~500 ms) and emits a frame per
poll while the field is `Some(<job_id>)`.

Payload shape (v1):

```
{
  "v":     1,
  "scans": [ScanProgress...]
}
```

Where each ScanProgress is:

```
{
  "source_id":             string,
  "kind":                  "update" | "rescan",
  "started_at_ms":         u64,
  "scanned_tracks":        u32,
  "estimated_total":       u32 | null,
  "current_relative_path": string | null,
  "phase":                 "scanning" | "complete"
}
```

`scanned_tracks` is MPD's `stats.songs` at poll time. For
`kind = "update"` it is monotonic (MPD only adds new tracks);
for `kind = "rescan"` it MAY transiently decrease as MPD
prunes stale entries before adding replacements — the value
still reflects wire truth at each poll and the terminal
frame carries the final count.

`estimated_total` is populated by a best-effort filesystem
walk of the source's mount path at scan start (bounded to
~30 s wall-clock). `null` when the walk cannot complete
within budget (large NAS mounts, permission-degraded trees)
— UI renders indeterminate progress rather than a wrong
denominator.

`current_relative_path` is `null` in the current wire; MPD's
scan protocol does not expose the file-under-scan and the
plugin does not synthesise one to keep the wire honest.

`phase` names the scan lifecycle position. The watcher
guarantees exactly one terminal frame per scan carrying
`phase = "complete"` and the final counts — the operator UI
keys on this to settle its `N of M` render without a reload.
Silence after a scan trigger, with no terminal frame, is a
substrate failure (never the healthy shape).

Full watcher lifecycle:

1. Announce (plugin load): `{ scans: [] }` — idle.
2. `library.update_source` fires: spawn a watcher with
   `source_id` + `kind`.
3. Watcher's first tick emits
   `{ scans: [{ source_id, kind, started_at_ms,
   scanned_tracks: 0, estimated_total: <best-effort>,
   phase: "scanning", current_relative_path: null }] }`.
4. Subsequent ticks (~500 ms) emit the same shape with
   `scanned_tracks` updated to `stats.songs`.
5. When MPD reports `updating_db = None`, watcher emits the
   terminal frame with `phase = "complete"` carrying the
   final counts; then republishes `audio_library_sources` +
   `audio_library_state` so the settled totals land without
   a UI reload; after ~2 s the empty envelope
   `{ scans: [] }` publishes so the resting state matches
   the documented idle shape.

Consumers subscribe to the subject via `subscribe_subject`
or observe the corresponding `SubjectStateChanged`
happening via `subscribe_happenings`. A process-wide gate
in the plugin serialises watcher spawns — two concurrent
`update_source` gestures fan out one watcher, not two.
"""

[[subjects]]
addressing = { scheme = "evo.audio.library", value = "triage" }
subject_type = "audio_library_triage"
description = """
Operator-visible drift-detection substrate for the library
plane. Announced on load with an empty envelope; republished
on every warm-start rehydrate, every idle
`Database` / `Update` burst, and every operator-triggered
`library.reconcile_triage` sweep.

Payload shape (v1):

```
{
  "v":                      1,
  "findings":               [TriageFinding...],
  "auto_reconciled_count":  u32,
  "prompt_required_count":  u32,
  "last_run_at_ms":         u64
}
```

Where each TriageFinding is:

```
{
  "class":              string,     // one of the stable class keys below
  "severity":           string,     // "info" | "warn" | "critical"
  "description":        string,     // one-line operator-visible summary
  "auto_reconciled":    bool,       // true when this sweep fired the safe reconcile action
  "reconciled_at_ms":   u64 | null, // wall-clock ms of reconcile completion; null when auto_reconciled is false
  "evidence":           object      // class-specific diagnostics blob
}
```

Wave-1 class keys (stable, snake-case):

- `mpd_db_empty_but_music_present` — files present under
  the plugin's `music_directory` on disk but MPD's
  `listallinfo` returns no `File` entries. Safe auto-
  reconcile: `mpc update` on the full DB.
- `registry_count_diverges` — the source registry's
  persisted `track_count` for the floor source disagrees
  with MPD's `stats.songs` wire truth. Safe auto-reconcile:
  apply wire truth + persist + republish
  `audio_library_state`.
- `curation_carries_gone_uris` — one or more URIs in the
  queue, favourites, or a stored playlist classify as Gone
  (absent from `listallinfo` under a reachable Online /
  Degraded source). Safe auto-reconcile: prune from every
  affected curation store and refresh the queue /
  favourites / playlist-index subjects.

All initial classes are safe-auto-reconcile. Additional
classes whose reconcile action requires an operator gesture
publish with `auto_reconciled: false` and a non-empty
`prompt_required_count`; the `library.reconcile_triage`
verb fires the safe classes and returns the envelope with
the prompt-required set intact for operator confirmation.

`last_run_at_ms` is the wall-clock ms of the last sweep
completion; zero before any sweep has run.

UI consumers subscribe to this subject for the operator-
visible triage panel (list of findings with per-row
severity, description, and reconcile timestamp). The
`library.get_triage` read verb returns the same envelope
without triggering a sweep.
"""
