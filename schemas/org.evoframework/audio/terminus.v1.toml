# Schema for the `audio.terminus` shelf at shape version 1.
#
# Terminus shelves host the post-mixer audio-derived signal
# surface — the framework-canonical place for spectrum FFT,
# loudness telemetry, and any future forward-decade consumer
# of the ALSA loopback tap on `pcm.evo`. The shelf is
# respondent-shaped: operator-visible reads (`get_spectrum_frame`
# today, loudness / fingerprint / transcription tomorrow)
# dispatch as requests; the live spectrum state is published
# as the `audio_playback_spectrum_frame` subject for read-then-
# subscribe consumers.
#
# Reference plugin: `org.evoframework.audio.terminus` in
# evo-device-audio. The plugin owns the ALSA loopback capture
# (the snd-aloop capture side of the pcm.evo tee), the FFT
# compute, and the transport / multi-room gating that decides
# when to emit frames.
#
# Cadence: the ALSA capture loop is paced by the sample
# rate / FFT hop (~47 Hz at 48 kHz / 1024-point). Emission
# to the subject is governed by a wall-clock throttle
# targeting `demand.rate_hz_target` (default 30 Hz); the
# wire `rate_hz` field on every emitted frame carries the
# governed emit rate subscribers actually receive at so
# they can drive their render loop off the subject rather
# than an assumed cadence.
#
# Shape: every emitted frame carries `bins` and `channels`
# fields that are the payload-truth authority. The producer
# reshapes to match the current
# `audio_playback_spectrum_demand` within one to two frames
# of a demand change; the demand subject is the control
# surface, the frame's `bins`/`channels` fields are the
# per-frame shape authority.

schema_version = 1
rack = "audio"
shelf = "terminus"
shape = 1

description = """
Post-mixer audio-derived signal surface. The reference plugin
taps the `pcm.evo` ALSA loopback and computes a mel-scale
Float32 FFT sized to the current demand (`bins ∈
{32, 64, 128, 256}`, `channels ∈ {1, 2}`) with peak-hold per
bin, per-band onset event detection, and — on stereo demand
— L/R correlation for stereo-imaging visualisations. On mono
demand the analyser averages L+R at the mel stage and the
correlation array is zero-length. Compute cadence is ALSA-
paced (one FFT per `FFT_SIZE` samples drawn at the
configured sample rate — ~47 Hz on the canonical
48 kHz / 1024-point chain); emission cadence is throttled
by a wall-clock governor to the demand's `rate_hz_target`
(default 30 Hz), decoupling wire cadence from ALSA hop.

Emission is gated on the `audio_playback_now_playing`
subject's `transport_state == "playing"` and on the local
device being the leader of any active multi-room group (or
being a solo device with no active group). Stopped / paused
sends no frames; followers do not publish a parallel
spectrum subject under the same name.

Failure semantics are permissive: ALSA capture-open failure
at admit lets the plugin admit cleanly with no frames
(operator sees the cause via `health_check`); capture-loop
transport errors trigger a bounded reconnect loop and the
plugin reports unhealthy only on retry exhaustion. The
audio floor invariant is preserved — terminus health does
not affect the primary playback path.
"""

# ----- Request types -----

[[requests]]
request_type = "get_spectrum_frame"
description = """
Return the current spectrum frame — the first-render parity
surface. Payload is the empty object `{}`.

Returns the same envelope shape as the
`audio_playback_spectrum_frame` subject: `{ v: 1, rate_hz:
u32, at_ms: u64, bins: u32, channels: u32, magnitudes:
[[f32...], ...], peak_hold: [[f32...], ...], onsets:
OnsetFlags, correlation: [f32...] }`. `bins` and `channels`
are the payload-truth shape authority — the values a
consumer MUST use to interpret this envelope, matching the
producer's current demand. `magnitudes` and `peak_hold` are
arrays-of-arrays with `channels` outer entries (1 on mono,
2 on stereo) and `bins` inner entries each. On stereo,
`correlation` carries `bins` per-bin L/R correlation
values; on mono, `correlation` is zero-length.

Frame values are in `[0.0, 1.0]` after the perceptual
scaling pass. `peak_hold` per-channel arrays carry the
decayed per-bin peaks so UI consumers can render a peak-hold
overlay without maintaining their own decay state.
`onsets` is a per-band flag set (`sub_bass`, `bass`, `mid`,
`high`) — each `bool` fires true on the frame where the band
crossed its detection threshold.

Consumers subscribing to the subject typically call this
verb once on connect to seed their render loop, then let
subject updates drive the frame stream. Callers connecting
during a stopped / paused transport (or with the demand
disabled) receive the empty-frame envelope shaped by the
current demand (all arrays present with zeroes at the
current `bins` / `channels`) rather than an error,
mirroring the truth-or-null wire discipline.
"""

[[requests]]
request_type = "audio.spectrum.set_demand"
description = """
Write the spectrum-demand control plane. Payload is
`{ v: 1, enabled: bool, bins: u32, channels: u32,
   rate_hz_target: u32 }` where `bins ∈ {32, 64, 128, 256}`
and `channels ∈ {1, 2}`. `rate_hz_target` is clamped to
`[1, 60]` at the plugin.

Returns `{ v: 1, applied: <full demand envelope> }` with the
demand values the plugin persisted (`applied.updated_at_ms`
carries the wall-clock stamp).

Semantics:

- `enabled = false` parks the producer identically to
  `TransportGate::NotPlaying` — the plugin closes its ALSA
  capture PCM (rig-verifiable via `lsof -p <pid>`), the
  outer capture loop idles, no FFT compute, no emit_frame.
  This is the operator-visible toggle's actual effect on
  device footprint; the pre-supersession implementation
  saved browser render CPU only.
- `enabled = true` with `bins` / `channels` at the operator's
  chosen values opens the capture path.
- `preset` / `palette` / `color_mode` / `sensitivity_db`
  are renderer-only and MUST NOT appear on the payload
  (rejected with Permanent via `deny_unknown_fields`). The
  UI folds `preset=off` into `enabled=false` at the settings
  layer so `enabled` is the single production-truth field.

Apply path: evo-ui-runtime's settings-patch bridge derives
the demand-write from any patch to `ui.visualizer.
{enabled, bin_count, channel_mode}` in the runtime's
settings store and calls this verb. Every settings origin
(settings surface, designer, any future client) inherits the
demand-write automatically — single write path prevents the
divergence class where a client patches the settings but
forgets to call the demand verb.

Refuses with structured Permanent on: unsupported payload
version; bins outside the enum; channels outside the enum;
unknown field in the payload.
"""

# ----- Subjects -----

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "spectrum_frame" }
subject_type = "audio_playback_spectrum_frame"
description = """
Live spectrum frame. Republished at the ALSA-paced FFT
cadence when the transport is playing and the local device
is the group leader (or solo). Envelope shape mirrors the
`get_spectrum_frame` verb response.

Consumers use the read-then-subscribe pattern: `get_spectrum_frame`
once on connect for the initial frame, subscribe to this
subject for the live stream. Cross-shelf addressing
(`evo.audio.playback:spectrum_frame`) reflects the shelf-of-
consumption (audio.playback for the operator UI) even though
the shelf-of-production is `audio.terminus` — the plugin
carries the burden of the cross-shelf composition so
consumers do not have to know the terminus shelf exists.
"""

[[subjects]]
addressing = { scheme = "evo.audio.playback", value = "spectrum_demand" }
subject_type = "audio_playback_spectrum_demand"
description = """
Spectrum-demand control plane. Announced at plugin load with
the disabled-default envelope; republished on every
`audio.spectrum.set_demand` verb dispatch.

Envelope shape (v1):

```
{
  "v":              1,
  "enabled":        bool,
  "bins":           u32,   // one of 32, 64, 128, 256
  "channels":       u32,   // one of 1, 2
  "rate_hz_target": u32,   // producer emit throttle; typical 30
  "updated_at_ms":  u64
}
```

`enabled` is the single production-truth field. When `false`,
the terminus producer parks (releases ALSA PCM, no FFT, no
emit) identically to `TransportGate::NotPlaying`. When
`true`, the producer opens the capture path and emits at the
demand's `bins` / `channels` shape.

Renderer-only choices (`preset`, `palette`, `color_mode`,
`sensitivity_db`) MUST NOT appear on this subject — those are
UI concerns with no production-plane meaning. `preset=off`
folds to `enabled=false` at the settings layer.

Apply path is the framework-side wire op
`audio.spectrum.set_demand` (see the request section above).
Consumers observing this subject typically read it once on
connect for the current shape; the frame-authoritative shape
lives on `audio_playback_spectrum_frame` per-frame (a
demand change may lead the analyser rebuild by one or two
frames — the frame's `bins`/`channels` fields are the shape
authority, the demand subject is the control surface).
"""

# ----- Acceptance rows -----

[[acceptance]]
name = "terminus-respondent-cardinality"
detail = "Only one plugin may claim the `audio.terminus` shelf at a time. The reference implementation is `org.evoframework.audio.terminus` in the audio distribution."

[[acceptance]]
name = "spectrum-demand-drives-producer-park-and-shape"
detail = "The `audio_playback_spectrum_demand` subject is the sole production-truth surface for the terminus producer. `enabled = false` MUST close the plugin's ALSA capture PCM (rig-verifiable via `lsof -p <pid>` — the loopback capture device MUST NOT appear in the FD list), idle the outer capture loop, and stop `emit_frame`. Silent-subject-with-FFT-still-spinning is a substrate defect; the operator toggle exists to reduce device footprint, not just browser render CPU. `enabled = true` opens the capture path. `preset`, `palette`, `color_mode`, `sensitivity_db` are renderer-only and MUST NOT reach the demand subject; the UI folds `preset=off` into `enabled=false` at the settings layer so `enabled` is the single production-truth field. `bins ∈ {32, 64, 128, 256}` and `channels ∈ {1, 2}` enums are refused with structured Permanent outside the enum. `rate_hz_target` is clamped to `[1, 60]` at the plugin. Apply path is the F1-A runtime bridge: evo-ui-runtime derives the demand-write from any `ui.visualizer.{enabled, bin_count, channel_mode}` settings patch and calls the `audio.spectrum.set_demand` verb; every settings origin inherits the demand-write by construction."

[[acceptance]]
name = "terminus-emission-gated-on-transport-and-leader"
detail = "Frame emission MUST be silent unless BOTH `audio_playback_now_playing.transport_state == \"playing\"` AND the local device is the leader of any active multi-room group (or no group is active). Followers MUST NOT emit a parallel `audio_playback_spectrum_frame` subject. The capture loop MUST continue running through paused / stopped transitions so a resume picks up at the next tick without spawn latency."

[[acceptance]]
name = "terminus-audio-floor-invariant"
detail = "Terminus plugin health MUST NOT affect the primary playback path. ALSA capture-open failure at admit, capture-loop transport errors, and reconnect-loop exhaustion are all local to the plugin's health — the primary `pcm.evo -> hw:CARD=<dac>` path continues unaffected. A `health_check` report of unhealthy on terminus never surfaces as a playback fault."

[[acceptance]]
name = "terminus-get-spectrum-frame-first-render-parity"
detail = "The `get_spectrum_frame` read verb MUST return the same envelope shape the subject publishes, including on quiet transports (stopped / paused) and on demand.enabled=false. The empty-frame shape (per-channel arrays populated with zeroes at the current demand's `bins` / `channels`; `onsets` all-false; `at_ms` = 0; `correlation` zero-length on mono) is a valid return, not an error. This preserves first-render parity: a UI panel subscribing to the subject and calling this verb once on connect renders the same shape whether audio is playing or not."

[[acceptance]]
name = "terminus-frame-shape-mirrors-demand"
detail = "Every emitted `audio_playback_spectrum_frame` MUST carry `bins` and `channels` fields that match the value at emission time; consumers MUST use those fields as the payload-truth shape authority (not any cached demand value). A demand change (via `audio.spectrum.set_demand`) MUST be reflected in the emitted frames within one to two frames — the producer rebuilds the analyser at the new shape and resumes emission. Between the demand-change tick and the analyser rebuild, the producer publishes an empty envelope at the NEW shape via the subject so subscribers never see a stale shape. `magnitudes` and `peak_hold` are shaped `[channels][bins]`. On `channels == 1` (mono demand), the analyser averages L+R at the mel stage and the `correlation` array is zero-length. On `channels == 2` (stereo demand), `correlation` carries `bins` per-bin L/R correlation values."

[[acceptance]]
name = "terminus-emit-rate-follows-demand-target"
detail = "Emission cadence to the `audio_playback_spectrum_frame` subject MUST be governed by a wall-clock throttle targeting the demand's `rate_hz_target` (default 30 Hz), not the ALSA hop rate. The emitted frame's `rate_hz` field MUST carry the target value. On the canonical 48 kHz / 1024-point chain (ALSA hop ~47 Hz), the measured emit rate MUST be within ±10% of the target — the producer drops (does not queue) analyser frames between emit ticks. `rate_hz_target` is clamped to `[1, 60]` at the plugin."
