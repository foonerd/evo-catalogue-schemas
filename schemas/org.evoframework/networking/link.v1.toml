# Schema for the `networking.link` shelf at shape version 1.
#
# Reference plugin: `org.evoframework.network` in evo-device-audio
# (NetworkManager back-end via nmcli + iw + rfkill).

schema_version = 1
rack = "networking"
shelf = "link"
shape = 1

description = """
Network link-control shelf. Plugin implements connection
management (status, scan, intent get/set/apply), captive-portal
detection and flow, security posture, flight-mode / radio
policy, wifi device inventory, and connectivity refresh.
Single-claimant per shelf.
"""

[[requests]]
request_type = "network.nm.status"
description = "Returns current link state, active connections, captive-portal status, radio/flight snapshot, and signal metrics."
payload_in = "{}"
payload_out = "{ v:1, status:ok|error, devices:[], connectivity:object, flight_mode:object, captive:object }"

[[requests]]
request_type = "network.nm.scan"
description = "Triggers a Wi-Fi scan and returns access-point list with signal/security/band info plus BSSID candidates."
payload_in = "{ ifname?: string }"
payload_out = "{ v:1, status:ok|error, available:[{ssid, signal, security, ...}], candidates:[{ssid, bssid, band, signal_pct}], cache_hit?: bool }"

[[requests]]
request_type = "network.nm.intent.get"
description = "Returns the persisted NetworkIntent envelope (ethernet, wifi, fallback, radio_policy)."
payload_in = "{}"
payload_out = "{ v:1, status:ok, intent:{ version, ethernet, wifi, fallback, radio_policy } }"

[[requests]]
request_type = "network.nm.intent.set"
description = "Updates the connection intent without applying. Secrets (PSK) travel as sidecar fields, not in intent.toml."
payload_in = "{ intent: NetworkIntent, sta_psk?: string, ap_psk?: string }"
payload_out = "{ v:1, status:ok, intent: NetworkIntent }"

[[requests]]
request_type = "network.nm.intent.apply"
description = "Applies the current intent (ethernet/STA/AP/hotspot/regdomain). Returns step log."
payload_in = "{}"
payload_out = "{ v:1, status:ok|error, ok: bool, steps:[string] }"

[[requests]]
request_type = "network.nm.captive.status"
description = "Returns captive-portal detection state (none, detected, in-flow, completed)."
payload_in = "{}"
payload_out = "{ v:1, status:ok, captive:{ phase, portal_url?, ... } }"

[[requests]]
request_type = "network.nm.captive.start"
description = "Initiates a captive-portal flow. Returns a session token consumed by submit/complete."
payload_in = "{}"
payload_out = "{ v:1, status:ok, session_token: string }"

[[requests]]
request_type = "network.nm.captive.submit"
description = "Submits captive-portal credentials for the active session."
payload_in = "{ session_token: string, credentials: object }"
payload_out = "{ v:1, status:ok|error }"

[[requests]]
request_type = "network.nm.captive.complete"
description = "Marks the captive-portal session complete. Plugin verifies connectivity."
payload_in = "{ session_token: string }"
payload_out = "{ v:1, status:ok|error, connectivity: object }"

[[requests]]
request_type = "network.nm.security.status"
description = "Returns network-security posture (PSK encryption at rest, harden hints)."
payload_in = "{}"
payload_out = "{ v:1, status:ok, security: object }"

[[requests]]
request_type = "network.nm.security.harden"
description = "Applies hardened secret-at-rest configuration."
payload_in = "{ enforce_runtime?: bool }"
payload_out = "{ v:1, status:ok|error, security: object }"

[[requests]]
request_type = "network.nm.flight_mode.get"
description = "Returns flight-mode state for the wireless class."
payload_in = "{}"
payload_out = "{ v:1, status:ok, flight_mode:{ enabled: bool, radio?: object } }"

[[requests]]
request_type = "network.nm.flight_mode.set"
description = "Sets flight-mode for the wireless class. On success the steward's post-dispatch hook emits Happening::FlightModeChanged { rack_class: \"wireless\", on: <enabled> } — single bus emission, no plugin-side duplicate."
payload_in = "{ enabled: bool }"
payload_out = "{ v:1, status:ok, flight_mode:{ enabled: bool, radio?: object } }"

[[requests]]
request_type = "network.nm.radio.status"
description = "Returns composed Wi-Fi radio preference view (flight + preference + rfkill)."
payload_in = "{}"
payload_out = "{ v:1, status:ok, flight_mode: bool, radios:{ wifi: object } }"

[[requests]]
request_type = "network.nm.radio.set"
description = "Sets per-family Wi-Fi preference (beyond flight mode). radio must be wifi."
payload_in = "{ radio: \"wifi\", preference: \"on\"|\"off\"|bool }"
payload_out = "{ v:1, status:ok, applied: bool, flight_mode: bool, radios:{ wifi: object } }"

[[requests]]
request_type = "network.nm.supervisor.status"
description = "Returns runtime supervisor reachability view (online/portal/limited/offline, critical recovery, observations)."
payload_in = "{}"
payload_out = "{ v:1, status:ok, supervisor: object }"

[[requests]]
request_type = "network.nm.wifi_devices"
description = "Live Wi-Fi radio inventory — PHY, modes, concurrent managed+AP, bands, connection class, virtual-AP-vif flag."
payload_in = "{}"
payload_out = "{ v:1, status:ok, devices:[{ ifname, phy, modes:[], supports_managed_plus_ap, bands, ... }] }"

[[requests]]
request_type = "network.nm.wifi.disconnect"
description = "Drop the active Wi-Fi STA link while preserving the saved profile — `nmcli device disconnect <wifi-ifname>`. Distinct from Forget (which clears wifi.sta_ssid in intent). Leaves evo-network-wifi-sta in place with its SSID and PSK sidecar; a later reconnect needs no re-entry. Gated write:network_admin (paired-operator connect path)."
payload_in = "{}"
payload_out = "{ v:1, status:ok|error, disconnected: bool, ifname: string, device_state: string, detail?: string }"

[[requests]]
request_type = "network.nm.captive.session.start"
description = "Open an operator-facing captive-portal session that the framework's attach_captive_session_endpoint serves at a same-origin URL on the management HTTPS plane. Plugin allocates a session_id, records the current portal's upstream_host + initial_path + initial_query, initialises an empty jar, and returns the framework-hosted session_url the UI iframes. All upstream HTTP is wlan0-bound via evo-captive-probe — the remote operator's browser never touches the venue. Gated write:network_admin."
payload_in = "{}"
payload_out = "{ v:1, status:ok, session_id: string, session_url: string, upstream_host: string, initial_path: string, initial_query: string, expires_at_epoch: u64 }"

[[requests]]
request_type = "network.nm.captive.upstream.fetch"
description = "Framework-called upstream fetch on an open captive session. Payload names session_id, HTTP method, path/query, request headers, request body_b64. Plugin resolves upstream_host + path?query, adds the jar's current Cookie, invokes wrapper proxy-fetch, parses response headers (updating the jar from any Set-Cookie), and returns the response bytes for the framework to rewrite Location + strip Set-Cookie + byte-substitute HTML before handing to the operator's browser. Gated write:network_admin."
payload_in = "{ session_id: string, method: string, path: string, query?: string, headers?: [{name, value}], body_b64?: string }"
payload_out = "{ v:1, status:ok, http_status: u16, http_status_text: string, headers: [{name, value}], body_b64: string, upstream_host: string, session_id: string }"

[[requests]]
request_type = "network.nm.captive.session.close"
description = "Explicit close for an operator-facing captive session. Drops the jar for session_id, re-runs captive_detect (still wlan0-bound), and returns the fresh reachability verdict. Gated write:network_admin."
payload_in = "{ session_id: string }"
payload_out = "{ v:1, status:ok, removed: bool, connectivity: object, captive: object }"

[[requests]]
request_type = "network.refresh_connectivity"
description = "On-demand connectivity-state refresh; returns freshly published networking.link.connectivity subject value."
payload_in = "{}"
payload_out = "{ v:1, status:ok, connectivity: object }"

# Intent field contract (NetworkIntent) — mirrored in
# NETWORK_REQUESTS_V1.md:
#   ethernet.{enabled, device|ifname, ipv4_mode, ipv4_address, ipv4_gateway, ipv4_dns[]}
#   wifi.{ifname, role, sta_ssid, sta_open, sta_hidden, sta_ipv4_*,
#         sta_selection_mode, sta_preferred_band, sta_lock_bssid,
#         ap_ssid, ap_channel, ap_band}
#   fallback.{hotspot_enabled, hotspot_connection_name, hotspot_ifname, hotspot_fallback}
#   radio_policy.{flight_mode, wifi_enabled_pref, bluetooth_enabled_pref,
#                 band_priority[], country, band_2ghz, band_5ghz, band_6ghz}

# Reactive bus PluginEvent taxonomy — emitted by the
# supervisor's transition watcher (not by verb dispatch);
# consumers subscribe to Happening::PluginEvent { plugin =
# "org.evoframework.network", event_type = <one of below> }:
#   network.reachability_changed
#   network.portal_detected
#   network.critical_recovery_raised
#   network.sta_restored
# Flight-mode transitions travel on Happening::FlightModeChanged
# via the steward post-dispatch hook — NOT on this PluginEvent
# channel (single story, no duplicate).

[[subjects]]
name = "networking.link.connectivity"
description = "Current connectivity verdict published by the link-control plugin."

[[subjects.fields]]
name = "interface_up"
type = "bool"
description = "At least one non-loopback interface is administratively up."

[[subjects.fields]]
name = "carrier"
type = "bool"
description = "At least one non-loopback interface has link carrier."

[[subjects.fields]]
name = "ip_address"
type = "option<ip_addr>"
description = "Preferred routable address."

[[subjects.fields]]
name = "default_gateway"
type = "option<ip_addr>"
description = "Current default-route next hop."

[[subjects.fields]]
name = "dns_resolves"
type = "bool"
description = "Last DNS resolution attempt succeeded."

[[subjects.fields]]
name = "internet_reachable"
type = "option<bool>"
description = "Last probe verdict. None until first probe or when probe_kind=off."

[[subjects.fields]]
name = "last_probe_at"
type = "option<system_time>"
description = "Timestamp of the last probe attempt."

[[subjects.fields]]
name = "last_change_at"
type = "system_time"
description = "Timestamp of the last subject-state change."

[[subjects.fields]]
name = "source"
type = "enum<rtnetlink|nm|polling|on_demand>"
description = "Input that triggered the last subject update."

[[acceptance]]
name = "link-single-claimant"
detail = "Cardinality refused at admission if a second link-control plugin attempts admission to the same shelf."

[[acceptance]]
name = "link-non-panic-on-backend-loss"
detail = "Plugin survives back-end loss (NetworkManager service stop) without panic. Returns structured error."

[[acceptance]]
name = "link-flight-mode-emits"
detail = "network.nm.flight_mode.set transitions emit Happening::FlightModeChanged { rack_class: \"wireless\", on: <state> }."

[[acceptance]]
name = "link-captive-flow-non-blocking"
detail = "Captive-portal flow does not block other request_types. Status / scan / flight_mode remain serviceable mid-flow."
